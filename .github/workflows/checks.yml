# Быстрые проверки на каждый пуш и PR (plans/tests-without-live-db-2026-09-15.md, шаг 4): lint, typecheck,
# unit, главная и тесты бота, на своём раннере. База (миграции, integration, e2e) и весь UI идут перед выкладкой,
# в release-checks.yml на раннерах GitHub (ADR-139): на своём раннере (боевой сервер, 2 ядра) UI не помещается
# и душит стойку, а на каждый пуш на GitHub съел бы бесплатные минуты за неделю.
# Секретов здесь нет и не будет (SECURITY.md §3): наборы, которым нужны внешние API, Telegram или ключ
# шифрования ПД, остаются ручными на рабочем стенде. Журнал tests/runs/ CI не пишет: он про доказательства
# на рабочем коде, а не про каждый пуш; логи здесь остаются в самом прогоне.
name: checks

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: checks-${{ github.ref }}
  # Запрос на слияние: новый пуш отменяет прогон старого, его итог уже никому не нужен. Main: прогон доходит до
  # конца, а следующий ждёт его (GitHub держит в очереди один, самый новый). С отменой и на main при частых
  # слияниях ни одна вершина main не получала итога: 02–03.10.2026 каждый прогон отменял следующий пуш,
  # и release нечем было проверить.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fast:
    name: lint · typecheck · unit · главная
    # Свой раннер на сервере (scripts/ops/ci-runner). 21.09.2026 включённые минуты GitHub были выбраны,
    # бюджет Actions стоит $0 со «Stop usage», и проверки перестали запускаться вовсе — падали за две
    # секунды с «job was not started». На self-hosted минуты не тарифицируются.
    runs-on: [self-hosted, linux, x64, wetop]
    # unit на раннере идёт 11 минут (прогон main 03.10.2026), вместе с typecheck и главной в 20 не помещается
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run generate -w @pms/database
      - run: npm run lint
      - run: npm run typecheck && npm run typecheck:api && npm run typecheck:web
      # Раннер живёт на боевом сервере (2 vCPU, ему 1,5): сборка модуля Nest в beforeAll там идёт дольше
      # 10 с по умолчанию (dashboard.controller.test, прогон main 03.10.2026); локально весь файл идёт за 2 с
      - run: npx vitest run --project unit --hookTimeout=30000
      # Без --with-deps: библиотеки Chromium уже в образе раннера, а sudo там не работает (scripts/ops/ci-runner/Dockerfile)
      - name: Chromium для проверок главной
        run: npx playwright install chromium
      - run: npm run site:check
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: site-check-results
          path: |
            tests/site/test-results
            test-results
          if-no-files-found: ignore

  bot:
    name: бот · pytest
    # Тесты ИИ-продавца (apps/ai-seller). До 02.10.2026 их в проверках не было, и четыре теста покраснели
    # незамеченными (ADR-137, замечание ментора). Python ставит uv в домашнюю папку раннера: в образе
    # раннера нет ни Python, ни его системных библиотек, sudo не нужен. Версия Python та же, что в образе
    # бота (apps/ai-seller/Dockerfile, сверяет tests/unit/ci-runner.test.ts). torch и sentence-transformers
    # не ставятся: тесты их не загружают, а с ними установка весит гигабайты.
    runs-on: [self-hosted, linux, x64, wetop]
    timeout-minutes: 20
    env:
      UV_VERSION: 0.12.21
      # Сумма из выпуска uv на GitHub (uv-x86_64-unknown-linux-gnu.tar.gz.sha256), меняется вместе с версией
      UV_SHA256: 23f02075b652bb1df64178cfae41b5caf160822e720e2663568f3f5d63bc52c0
      BOT_PYTHON: '3.13'
    defaults:
      run:
        working-directory: apps/ai-seller
    steps:
      - uses: actions/checkout@v4
      - name: uv закреплённой версии со сверкой суммы
        run: |
          curl -fsSL -o "$RUNNER_TEMP/uv.tar.gz" \
            "https://github.com/astral-sh/uv/releases/download/$UV_VERSION/uv-x86_64-unknown-linux-gnu.tar.gz"
          echo "$UV_SHA256  $RUNNER_TEMP/uv.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/uv.tar.gz" -C "$RUNNER_TEMP" --strip-components=1
          "$RUNNER_TEMP/uv" --version
      - name: Python и зависимости бота без torch
        run: |
          grep -v -E '^[[:space:]]*(torch|sentence-transformers|--extra-index-url)' requirements.txt \
            > "$RUNNER_TEMP/bot-requirements.txt"
          "$RUNNER_TEMP/uv" venv --python "$BOT_PYTHON" --python-preference only-managed "$RUNNER_TEMP/bot-venv"
          "$RUNNER_TEMP/uv" pip install --python "$RUNNER_TEMP/bot-venv/bin/python" \
            -r "$RUNNER_TEMP/bot-requirements.txt"
      - name: pytest бота
        run: |
          "$RUNNER_TEMP/bot-venv/bin/python" --version
          "$RUNNER_TEMP/bot-venv/bin/python" -m pytest -q -p no:cacheprovider
