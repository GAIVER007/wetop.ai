# Автопрогон на каждый коммит (16.09.2026).
#
# Зачем: до сегодняшнего дня ни один коммит в проекте не проверялся ничем, кроме ноутбука
# владельца. При трёх сессиях, правящих один репозиторий, поломка от соседа обнаруживалась
# в лучшем случае через сутки.
#
# Что здесь есть: проверка типов, линтер и модульные тесты — всё, чему не нужно ничего
# внешнего. Это около 890 проверок из примерно 920.
#
# Чего здесь нет и почему:
#   • интеграционные — нужна dev-база через пулер Supabase. Можно добавить, положив
#     DATABASE_URL в секреты репозитория; решение за владельцем, это доступ к живым данным;
#   • сквозные (e2e) — нужен поднятый PMS, браузер и база. Им место на сервере, а не здесь;
#   • запись в журнал прогонов (`tests/runs/`) — журнал привязан к машине и коммиту и служит
#     доказательством по AGENTS.md §6. Записи отсюда были бы доказательством «прогнал робот
#     на пустой машине», а это другой смысл. Журнал остаётся ручным.

name: Проверки

on:
  push:
    branches: [main]
  pull_request:

# Новый коммит в ту же ветку отменяет предыдущий прогон: ждать устаревший результат незачем.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Типы, линтер, модульные тесты
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # ci, а не install: ставит ровно то, что записано в package-lock.json.
      # Разъехавшиеся версии — это прогон, который ничего не доказывает.
      - name: Зависимости
        run: npm ci

      # Клиент Prisma не под учётом git (.gitignore), а типы из него нужны проверке типов.
      # Без этого шага typecheck падает на первом же импорте из @pms/database.
      - name: Клиент Prisma
        run: npm run generate -w @pms/database

      - name: Проверка типов
        run: npm run typecheck

      - name: Линтер
        run: npm run lint

      # Напрямую vitest, а не test:record: запись в журнал остаётся ручной (см. шапку).
      - name: Модульные тесты
        run: npx vitest run --project unit
