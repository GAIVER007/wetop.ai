# Проверки на каждый пуш и PR (plans/tests-without-live-db-2026-09-15.md, шаг 4).
# Секретов здесь нет и не будет (SECURITY.md §3): наборы, которым нужны внешние API, Telegram или ключ
# шифрования ПД, остаются ручными на рабочем стенде. Журнал tests/runs/ CI не пишет — он про доказательства
# на рабочем коде, а не про каждый пуш; логи здесь остаются в самом прогоне.
name: checks

on:
  push:
    branches: [main]
  pull_request:

# Очередь у каждой задачи своя (ниже), а не у workflow целиком: иначе, пока задачи своего раннера стоят в очереди
# (раннер wetop выключен или занят), новый прогон висит «pending» и задача db на раннере GitHub не стартует вовсе
# (01.10.2026: прогон 836 ждал прогон 834, у которого на раннер GitHub уже всё отработало).

# Свой раннер стоит на боевом сервере (scripts/ops/ci-runner) и исполняет код из запросов на слияние. Код из форка
# на него не попадает: задачи на своём раннере идут только для пушей в этот репозиторий и PR из его же веток
# (разбор 01.10.2026, reports/order-2026-10-01, пункт 9). Форки у репозитория выключены в настройках GitHub
# (docs/ops/github-protection.md), это условие: второй замок на случай, если их включат.
jobs:
  fast:
    name: lint · typecheck · unit · главная
    concurrency:
      group: checks-fast-${{ github.ref }}
      cancel-in-progress: true
    # Свой раннер на сервере (scripts/ops/ci-runner). 21.09.2026 включённые минуты GitHub были выбраны,
    # бюджет Actions стоит $0 со «Stop usage», и проверки перестали запускаться вовсе — падали за две
    # секунды с «job was not started». На self-hosted минуты не тарифицируются.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, wetop]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run generate -w @pms/database
      - run: npm run lint
      - run: npm run typecheck && npm run typecheck:api && npm run typecheck:web
      - run: npx vitest run --project unit
      - name: Chromium для проверок главной
        run: npx playwright install --with-deps chromium
      - run: npm run site:check
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: site-check-results
          path: |
            tests/site/test-results
            test-results
          if-no-files-found: ignore

  db:
    name: миграции · integration · e2e на чистом PostgreSQL 16
    concurrency:
      group: checks-db-${{ github.ref }}
      cancel-in-progress: true
    # Единственная задача, оставшаяся на раннерах GitHub: ей нужен `services: postgres`, то есть Docker
    # внутри раннера. Давать своему раннеру сокет Docker нельзя — это root на машине, где рядом чужие
    # проекты. Пока минуты не восстановлены, эта проверка молчит; это известное ограничение.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pms
          POSTGRES_PASSWORD: pms
          POSTGRES_DB: postgres
          # Как локальный стенд (scripts/ops/local-db.sh): вход по trust, роль wetop_app входит без пароля.
          # Тесты rls-isolation и integration-tables-role подставляют wetop_app в DATABASE_URL без пароля;
          # с паролем на раннере они падали «SASL: client password must be a string» (разбор 01.10.2026, п. 8).
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Клиент PostgreSQL 16 (psql, pg_dump той же мажорной версии, что сервер)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16
          psql --version && pg_dump --version
      # Зависимости — до проверки миграций: она сверяет schema.prisma с базой из миграций CLI Prisma
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run generate -w @pms/database
      - name: Применение и откат каждой миграции, schema.prisma против базы из миграций
        env:
          MIGRATION_CHECK_URL: postgresql://pms:pms@127.0.0.1:5432/postgres
        run: scripts/ops/check-migrations.sh
      # Дальше — тесты на пустой базе: схему pms_test и данные (сид) они создают сами (tests/README.md)
      - run: psql postgresql://pms:pms@127.0.0.1:5432/postgres -c 'CREATE DATABASE pms_dev' -c '\c pms_dev' -c 'CREATE EXTENSION IF NOT EXISTS btree_gist'
      # Схема public тоже заполняется миграциями, как на локальном стенде: rls-isolation и rls-credential-grants ходят
      # в базу сырым pg по DATABASE_URL и ждут таблицы в current_schema(); с пустой public они падали
      # «relation … does not exist» на каждом PR с 30.09 (разбор 01.10.2026, п. 8). DIRECT_URL задан явно:
      # prisma.config.ts предпочитает его и иначе дочитал бы из .env (здесь его нет, но правило то же, что в local-db.sh)
      - name: Миграции в public, как на локальном стенде
        env:
          DATABASE_URL: postgresql://pms:pms@127.0.0.1:5432/pms_dev
          DIRECT_URL: postgresql://pms:pms@127.0.0.1:5432/pms_dev
        run: npm run migrate:deploy -w @pms/database
      # И вымышленный объект в public (ADR-010), как делает local-db.sh после test:schema: rls-isolation и
      # integration-tables-role берут объект и организацию из public, без них «Cannot read properties of undefined»
      - name: Сид объекта в public, как на локальном стенде
        env:
          DATABASE_URL: postgresql://pms:pms@127.0.0.1:5432/pms_dev
          DATABASE_SCHEMA: ''
        run: npx tsx tests/tools/seed-local.ts
      - name: Интеграционные тесты
        env:
          DATABASE_URL: postgresql://pms:pms@127.0.0.1:5432/pms_dev
        run: npx vitest run --project integration
      - name: Сборка стойки и Chromium
        run: |
          npm run build -w apps/web
          npx playwright install --with-deps chromium
      - name: Сквозные тесты
        env:
          DATABASE_URL: postgresql://pms:pms@127.0.0.1:5432/pms_dev
        run: npx playwright test --workers=2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: test-results
          if-no-files-found: ignore

  ui-shard:
    name: UI · часть ${{ matrix.shard }}/3
    concurrency:
      group: checks-ui-${{ matrix.shard }}-${{ github.ref }}
      cancel-in-progress: true
    # Три части UI — основной расход минут; базы им не нужно, поэтому они и уходят на свой раннер.
    # Раннер один и берёт задачи по очереди: части идут не параллельно, а друг за другом.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, wetop]
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run generate -w @pms/database
      - run: npx playwright install --with-deps chromium
      # Браузер — chromium Playwright (на Mac набор идёт в Chrome владельца); next dev и подставной API поднимает конфиг
      - name: Браузерные проверки без базы
        env:
          UI_BROWSER_CHANNEL: chromium
        run: npx playwright test --config tests/ui/playwright.config.ts --shard=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-results-${{ matrix.shard }}
          path: |
            test-results
            reports/ui-quality
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-visual-diffs-${{ matrix.shard }}
          path: test-results/design-system-*/**/*.png
          if-no-files-found: ignore

  ui:
    # Сохраняем прежнее имя обязательной проверки; успешны должны быть все части.
    name: стойка на синтетическом API (tests/ui)
    concurrency:
      group: checks-ui-all-${{ github.ref }}
      cancel-in-progress: true
    needs: ui-shard
    if: always() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux, x64, wetop]
    steps:
      - name: Все части UI прошли
        env:
          UI_RESULT: ${{ needs.ui-shard.result }}
        run: test "$UI_RESULT" = success

  bot:
    name: ИИ-помощник и продавец · pytest (apps/ai-seller)
    concurrency:
      group: checks-bot-${{ github.ref }}
      cancel-in-progress: true
    # Тесты бота идут без базы, Redis и сети (apps/ai-seller/testy.md), на том же раннере. До 01.10.2026 их в
    # проверках GitHub не было, и `release` мог уйти вперёд с красным ботом (разбор 01.10.2026, пункт 8).
    # torch ставится сборкой CPU с индекса PyTorch (requirements.txt), кэш pip держит её между прогонами.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, wetop]
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/ai-seller
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: apps/ai-seller/requirements.txt
      - run: python -m pip install --quiet --upgrade pip
      - run: python -m pip install --quiet -r requirements.txt
      - run: python -m pytest -q
