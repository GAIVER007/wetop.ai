name: finance-presentation-regression

on:
  push:
    branches: ['fix/staged-finance-release-20261019', 'fix/stage1-finance-source-20261019']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finance-presentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run generate -w @pms/database
      - name: FIN-01 source-component regression, no database or server
        run: npm run test:record -- unit tests/unit/finance-outflow-label.test.ts tests/unit/staged-release-controls.test.ts --maxWorkers=1 --note "FIN stage source and fail-closed prebuild/promotion controls; synthetic data only"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: finance-presentation-test-record
          path: tests/runs/
          if-no-files-found: warn
          retention-days: 7

  chessboard-contract:
    name: Exact two-night TEST3 fixture contract, three repetitions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      UI_BROWSER_CHANNEL: chromium
      UI_RUNTIME_WORKERS: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run generate -w @pms/database
      - run: npx playwright install --with-deps chromium
      - name: Keep original strict assertions; no retries or skipped cases
        run: >-
          npx playwright test --config tests/ui/playwright.config.ts chessboard-card.spec.ts
          --grep '30 дней: плашка в две ночи' --workers=1 --repeat-each=3 --retries=0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: stage1-test3-fixture-failure
          path: test-results/
          retention-days: 7
