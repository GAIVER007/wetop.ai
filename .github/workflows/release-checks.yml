# Проверка кандидата в выкладку (ADR-139), единственная проверка GitHub в репозитории: lint, typecheck, unit,
# главная, тесты бота, база (миграции, integration, сквозные) и весь UI стойки, на раннерах GitHub. `release`
# перематывается только на коммит, у которого она зелёная (AGENTS.md §18). Своего раннера на боевом сервере больше
# нет: 03.10.2026 проверки там поднимали нагрузку до 85 при 2 ядрах и роняли стойку.
#
# Запуск (ADR-152, решение владельца 09.10.2026, автовыкладка): пуш кода в `main` (слияние PR), пуш в
# `release-candidate` или кнопка Actions → release-checks → Run workflow. Зелёный гейт на `main` перематывает
# `release` сам (auto-release.yml), дальше сервер забирает и выкладывает (ADR-080). Документы гейт не гоняют
# (paths-ignore): выкладки они не требуют. Один прогон стоит около 95 минут из 2000 бесплатных в месяц
# (бюджет Actions $0 со «Stop usage»); вершины main встают в очередь concurrency ниже. Свои наборы
# сессии по-прежнему гоняют сами до слияния (TESTING.md).
# Секретов здесь нет и не будет (SECURITY.md §3).
name: release-checks

on:
  workflow_dispatch:
  push:
    branches: [release-candidate, main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'plans/**'
      - 'reports/**'
      - 'tasks/**'
      - 'templates/**'
      - 'tests/runs/**'
      - 'outbox/**'
      - 'project-input/**'
      - 'Claude outputs/**'

# На main прогон не отменяется следующим слиянием, а ждёт в очереди: GitHub держит один идущий и один ожидающий
# (самый свежий), промежуточные вершины схлопываются. Иначе гейт около 95 минут не доходит до конца, когда слияния
# идут чаще: с 10.10.2026 по 11.10 из 59 прогонов на main 39 отменены, ни одного зелёного, release не двигался.
# Минут это не прибавляет: отменённый прогон тоже их тратит, только без итога. На прочих ветках новый прогон
# по-прежнему заменяет прежний: их итог release не перематывает.
concurrency:
  group: release-checks-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  fast:
    name: lint · typecheck · unit · главная
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run generate -w @pms/database
      - run: npm run lint
      - run: npm run typecheck && npm run typecheck:api && npm run typecheck:web
      - run: npx vitest run --project unit
      - name: Chromium для проверок главной
        run: npx playwright install --with-deps chromium
      - run: npm run site:check
      - uses: actions/upload-artifact@v4
        if: failure() && !startsWith(github.ref, 'refs/heads/codex/ui-fix-01-')
        with:
          name: site-check-results
          path: |
            tests/site/test-results
            test-results
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure() && startsWith(github.ref, 'refs/heads/codex/ui-fix-01-')
        with:
          name: site-check-results
          path: |
            tests/site/test-results/**/*.png
            test-results/**/*.png
          if-no-files-found: ignore

  bot:
    name: бот · pytest
    # Тесты ИИ-продавца (apps/ai-seller). До 02.10.2026 их в проверках не было, и четыре теста покраснели
    # незамеченными (ADR-137, замечание ментора). Python ставит закреплённый uv; версия Python та же, что в образе
    # бота (apps/ai-seller/Dockerfile, сверяет tests/unit/ci-runner.test.ts). torch и sentence-transformers
    # не ставятся: тесты их не загружают, а с ними установка весит гигабайты.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      UV_VERSION: 0.12.21
      # Сумма из выпуска uv на GitHub (uv-x86_64-unknown-linux-gnu.tar.gz.sha256), меняется вместе с версией
      UV_SHA256: 23f02075b652bb1df64178cfae41b5caf160822e720e2663568f3f5d63bc52c0
      BOT_PYTHON: '3.13'
    defaults:
      run:
        working-directory: apps/ai-seller
    steps:
      - uses: actions/checkout@v4
      - name: uv закреплённой версии со сверкой суммы
        run: |
          curl -fsSL -o "$RUNNER_TEMP/uv.tar.gz" \
            "https://github.com/astral-sh/uv/releases/download/$UV_VERSION/uv-x86_64-unknown-linux-gnu.tar.gz"
          echo "$UV_SHA256  $RUNNER_TEMP/uv.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/uv.tar.gz" -C "$RUNNER_TEMP" --strip-components=1
          "$RUNNER_TEMP/uv" --version
      - name: Python и зависимости бота без torch
        run: |
          grep -v -E '^[[:space:]]*(torch|sentence-transformers|--extra-index-url)' requirements.txt \
            > "$RUNNER_TEMP/bot-requirements.txt"
          "$RUNNER_TEMP/uv" venv --python "$BOT_PYTHON" --python-preference only-managed "$RUNNER_TEMP/bot-venv"
          "$RUNNER_TEMP/uv" pip install --python "$RUNNER_TEMP/bot-venv/bin/python" \
            -r "$RUNNER_TEMP/bot-requirements.txt"
      - name: pytest бота
        run: |
          "$RUNNER_TEMP/bot-venv/bin/python" --version
          "$RUNNER_TEMP/bot-venv/bin/python" -m pytest -q -p no:cacheprovider

  db:
    name: миграции · integration · e2e на чистом PostgreSQL 16
    # при красных lint, typecheck или unit минуты на базу не тратятся
    needs: fast
    # Нужен `services: postgres`, то есть Docker внутри раннера: своему раннеру сокет Docker не даём, это root
    # на машине, где рядом боевая стойка и чужие проекты.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pms
          POSTGRES_PASSWORD: pms
          POSTGRES_DB: postgres
          # Вход по сети без пароля, как на стенде разработчика: тесты RLS ходят ролью wetop_app без пароля
          # (вход ей включает tests/tools/local-app-login.ts, только на локальной базе). Без этого postgres:16
          # требует пароль, и pg падал «client password must be a string» (прогон main 03.10.2026).
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Клиент PostgreSQL 16 (psql, pg_dump той же мажорной версии, что сервер)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16
          psql --version && pg_dump --version
      # Зависимости ставятся до проверки миграций: она сверяет schema.prisma с базой из миграций CLI Prisma
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run generate -w @pms/database
      - name: Применение и откат каждой миграции, schema.prisma против базы из миграций
        env:
          MIGRATION_CHECK_URL: postgresql://pms:pms@127.0.0.1:5432/postgres
        run: scripts/ops/check-migrations.sh
      # Дальше тесты на пустой базе: схему pms_test и данные (сид) они создают сами (tests/README.md)
      - run: psql postgresql://pms:pms@127.0.0.1:5432/postgres -c 'CREATE DATABASE pms_dev' -c '\c pms_dev' -c 'CREATE EXTENSION IF NOT EXISTS btree_gist'
      - name: Интеграционные тесты
        env:
          DATABASE_URL: postgresql://pms:pms@127.0.0.1:5432/pms_dev
        run: npx vitest run --project integration
      - name: Сборка стойки и Chromium
        run: |
          npm run build -w apps/web
          npx playwright install --with-deps chromium
      # Интеграционные тесты оставляют в pms_test свои строки (reservation-create-retry заводит ячейку на каждый
      # прогон), а сквозные сверяют сид число в число (88 ячеек): перед ними сид заново
      - name: Свежий сид pms_test для сквозных
        env:
          DATABASE_URL: postgresql://pms:pms@127.0.0.1:5432/pms_dev
        run: npm run test:schema -- --refresh
      - name: Мастер настройки, сохранение и восстановление в браузере
        env:
          DATABASE_URL: postgresql://pms:pms@127.0.0.1:5432/pms_dev
        run: npx playwright test --config tests/onboarding/playwright.config.ts
      - name: Сквозные тесты
        # Вошедшим пользователем (решение владельца 07.10.2026): после MV8 стойка без входа не угадывает гостиницу
        env:
          DATABASE_URL: postgresql://pms:pms@127.0.0.1:5432/pms_dev
          E2E_AUTH: '1'
        run: npx playwright test --workers=2
      - uses: actions/upload-artifact@v4
        if: failure() && !startsWith(github.ref, 'refs/heads/codex/ui-fix-01-')
        with:
          name: e2e-results
          path: test-results
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure() && startsWith(github.ref, 'refs/heads/codex/ui-fix-01-')
        with:
          name: e2e-results
          path: |
            test-results/**/*.png
          if-no-files-found: ignore

  ui-shard:
    name: UI · часть ${{ matrix.shard }}/4
    needs: fast
    # Четыре части сохраняют полный UI-набор на отдельных раннерах с одной рабочей нитью.
    # UI-FIX-01 run 38263677879: первая из трёх частей не завершила 552 случая за 60 минут.
    # Построчный отчёт сохраняет имя и диагностику ошибки сразу, включая прерванный прогон.
    # Замок входа остаётся отдельным шагом первой части; лимит времени не увеличивается.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run generate -w @pms/database
      # Раннер GitHub: системные библиотеки Chromium ставит сам Playwright (sudo здесь есть)
      - run: npx playwright install --with-deps chromium
      # Браузер: chromium Playwright (на Mac набор идёт в Chrome владельца); next dev и подставной API поднимает конфиг
      - name: Браузерные проверки без базы
        env:
          UI_BROWSER_CHANNEL: chromium
        run: npx playwright test --config tests/ui/playwright.config.ts --shard=${{ matrix.shard }}/4 --reporter=line
      - name: Единый вход с включённым замком
        if: matrix.shard == 1 && !cancelled()
        env:
          UI_BROWSER_CHANNEL: chromium
        run: npx playwright test --config tests/ui/playwright.auth.config.ts
      - uses: actions/upload-artifact@v4
        if: failure() && !startsWith(github.ref, 'refs/heads/codex/ui-fix-01-')
        with:
          name: ui-results-${{ matrix.shard }}
          path: |
            test-results
            reports/ui-quality
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: failure() && startsWith(github.ref, 'refs/heads/codex/ui-fix-01-')
        with:
          name: ui-results-${{ matrix.shard }}
          path: |
            test-results/**/*.png
            reports/ui-quality/**/*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-visual-diffs-${{ matrix.shard }}
          path: test-results/design-system-*/**/*.png
          if-no-files-found: ignore

  ui-vertical:
    name: UI · ${{ matrix.suite }}
    needs: fast
    # Наборы салона, ресторана и филиалов (MV8.5 DS0a, решение владельца 07.10.2026): до этого их axe
    # и ширины 390/1440 гонялись только руками. Три набора идут параллельно с `db` и `ui-shard`,
    # стена гейта почти не растёт; минуты каждого записаны в отчёте среза. Подставные API наборов
    # читают схему pms_test локальной базы, поэтому у задачи своя служба postgres, как у `db`.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [beauty-ui, food-ui, branches-ui]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pms
          POSTGRES_PASSWORD: pms
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://pms:pms@127.0.0.1:5432/pms_dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run generate -w @pms/database
      - name: База pms_dev и схема pms_test с миграциями
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16
          psql postgresql://pms:pms@127.0.0.1:5432/postgres -c 'CREATE DATABASE pms_dev' -c '\c pms_dev' -c 'CREATE EXTENSION IF NOT EXISTS btree_gist'
          npm run test:schema
      - run: npx playwright install --with-deps chromium
      - name: Браузерный набор на подставном API и настоящей схеме
        run: npx playwright test --config tests/${{ matrix.suite }}/playwright.config.ts
      - uses: actions/upload-artifact@v4
        if: failure() && !startsWith(github.ref, 'refs/heads/codex/ui-fix-01-')
        with:
          name: ui-vertical-${{ matrix.suite }}
          path: |
            tests/${{ matrix.suite }}/test-results
            test-results
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure() && startsWith(github.ref, 'refs/heads/codex/ui-fix-01-')
        with:
          name: ui-vertical-${{ matrix.suite }}
          path: |
            tests/${{ matrix.suite }}/test-results/**/*.png
            test-results/**/*.png
          if-no-files-found: ignore

  ui:
    # Сохраняем прежнее имя обязательной проверки; успешны должны быть все части.
    name: стойка на синтетическом API (tests/ui)
    needs: ui-shard
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Все части UI прошли
        env:
          UI_RESULT: ${{ needs.ui-shard.result }}
        run: test "$UI_RESULT" = success


  ui-fix-01-proof:
    name: UI-FIX-01 isolated proof
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/codex/ui-fix-01-')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pms
          POSTGRES_PASSWORD: pms
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://pms:pms@127.0.0.1:5432/pms_dev
      DATABASE_APP_URL: postgresql://wetop_app@127.0.0.1:5432/pms_dev?schema=pms_test
      DATABASE_SCHEMA: pms_test
      DATABASE_POOL_MAX: '2'
      DATABASE_APP_POOL_MAX: '2'
      UI_BROWSER_CHANNEL: chromium
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      UV_VERSION: 0.12.21
      UV_SHA256: 23f02075b652bb1df64178cfae41b5caf160822e720e2663568f3f5d63bc52c0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run generate -w @pms/database
      - run: npx playwright install --with-deps chromium
      - name: Local database and runtime role
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16
          psql postgresql://pms:pms@127.0.0.1:5432/postgres -c 'CREATE DATABASE pms_dev' -c '\c pms_dev' -c 'CREATE EXTENSION IF NOT EXISTS btree_gist'
          npm run test:schema
          npx tsx tests/tools/local-app-login.ts
      - name: Python without ML packages
        run: |
          curl -fsSL -o "$RUNNER_TEMP/uv.tar.gz" "https://github.com/astral-sh/uv/releases/download/$UV_VERSION/uv-x86_64-unknown-linux-gnu.tar.gz"
          echo "$UV_SHA256  $RUNNER_TEMP/uv.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/uv.tar.gz" -C "$RUNNER_TEMP" --strip-components=1
          grep -v -E '^[[:space:]]*(torch|sentence-transformers|--extra-index-url)' apps/ai-seller/requirements.txt > "$RUNNER_TEMP/bot-requirements.txt"
          "$RUNNER_TEMP/uv" venv --python 3.13 --python-preference only-managed "$RUNNER_TEMP/ui-fix-01-python"
          "$RUNNER_TEMP/uv" pip install --python "$RUNNER_TEMP/ui-fix-01-python/bin/python" -r "$RUNNER_TEMP/bot-requirements.txt"
          echo "UI_FIX_01_PYTHON=$RUNNER_TEMP/ui-fix-01-python/bin/python" >> "$GITHUB_ENV"
      - name: Addressed units and scope integration
        id: addressed
        continue-on-error: true
        run: |
          npm run test:record -- unit tests/unit/food-customer-update.test.ts apps/web/src/app/team/scope-model.test.ts apps/web/src/app/help/help.test.ts apps/web/src/app/platform/support/kb-forms.test.ts apps/web/src/app/login/actions.test.ts tests/unit/chessboard-active-readonly.test.ts
          npm run test:record -- integration tests/integration/member-scopes.test.ts
      - name: Real web API DB and KB storage
        id: runtime
        continue-on-error: true
        run: |
          npm run test:record -- e2e --config tests/ui-fix-01-runtime/playwright.config.ts --workers=1
          cd apps/ai-seller
          "$UI_FIX_01_PYTHON" -m pytest ../../tests/ui-fix-01-runtime/test_support_kb_panel.py -q -p no:cacheprovider
      - name: UI controlled failures and adjacent regressions
        id: regression
        continue-on-error: true
        env:
          UI_FIXTURE_PORT: '4371'
          UI_WEB_PORT: '3171'
        run: npm run test:record -- e2e --config tests/ui/playwright.alt.config.ts --workers=1 tests/ui/ui-fix-01-access.spec.ts tests/ui/ui-fix-01-kb.spec.ts tests/ui/hospitality-read-only.spec.ts tests/ui/team.spec.ts tests/ui/support-kb.spec.ts tests/ui/trial-read-only.spec.ts tests/ui/chessboard-extend.spec.ts
      - uses: actions/checkout@v4
        with:
          ref: 47b86b08fc0d7d1093fa835679b2d1f7134d2e3f
          path: ui-fix-01-baseline
      - name: Matching Linux before screenshots
        id: before
        continue-on-error: true
        env:
          UI_FIX_01_VISUAL: before
          UI_FIXTURE_PORT: '4371'
          UI_WEB_PORT: '3171'
        run: |
          cp tests/ui/ui-fix-01-visual.spec.ts ui-fix-01-baseline/tests/ui/
          cd ui-fix-01-baseline
          npm ci --no-audit --no-fund
          npm run generate -w @pms/database
          npm run test:record -- e2e --config tests/ui/playwright.alt.config.ts --workers=1 tests/ui/ui-fix-01-visual.spec.ts
      - name: Expected RED for stale scope UI on fixed baseline
        id: stale_red
        continue-on-error: true
        env:
          UI_FIXTURE_PORT: '4371'
          UI_WEB_PORT: '3171'
        run: |
          cp tests/ui/ui-fix-01-access.spec.ts ui-fix-01-baseline/tests/ui/
          cp apps/web/src/app/login/actions.test.ts ui-fix-01-baseline/apps/web/src/app/login/
          cd ui-fix-01-baseline
          set +e
          npm run test:record -- unit apps/web/src/app/login/actions.test.ts
          unit_result=$?
          set -e
          test "$unit_result" -eq 1
          node -e "const fs=require('fs'); const p='tests/runs/entries/'; const files=fs.readdirSync(p).sort(); const r=JSON.parse(fs.readFileSync(p+files.at(-1))); if(r.codeChangedDuringRun || r.counts.total!==7 || r.counts.failed!==2 || r.counts.passed!==5) process.exit(1);"
          set +e
          npm run test:record -- e2e --config tests/ui/playwright.alt.config.ts --workers=1 tests/ui/ui-fix-01-access.spec.ts --grep "scope switch closes"
          result=$?
          set -e
          test "$result" -eq 1
          node -e "const fs=require('fs'); const p='tests/runs/entries/'; const files=fs.readdirSync(p).sort(); const r=JSON.parse(fs.readFileSync(p+files.at(-1))); if(r.codeChangedDuringRun || r.counts.total!==1 || r.counts.failed!==1 || r.counts.passed!==0) process.exit(1);"
      - uses: actions/checkout@v4
        with:
          ref: ddba4e1bc35ff43fb8cd681725257bd95a414b65
          path: ui-fix-01-new-draft-red
      - name: Expected RED for initial create B with typed C
        id: new_draft_red
        continue-on-error: true
        env:
          UI_FIXTURE_PORT: '4371'
          UI_WEB_PORT: '3171'
        run: |
          cp tests/ui/ui-fix-01-kb.spec.ts ui-fix-01-new-draft-red/tests/ui/
          cd ui-fix-01-new-draft-red
          npm ci --no-audit --no-fund
          npm run generate -w @pms/database
          set +e
          npm run test:record -- e2e --config tests/ui/playwright.alt.config.ts --workers=1 tests/ui/ui-fix-01-kb.spec.ts --grep "initial create B"
          result=$?
          set -e
          test "$result" -eq 1
          node -e "const fs=require('fs'); const p='tests/runs/entries/'; const files=fs.readdirSync(p).sort(); const r=JSON.parse(fs.readFileSync(p+files.at(-1))); if(r.codeChangedDuringRun || r.counts.total!==1 || r.counts.failed!==1 || r.counts.passed!==0) process.exit(1);"
      - name: Matching Linux after screenshots
        id: after
        continue-on-error: true
        env:
          UI_FIX_01_VISUAL: after
          UI_FIXTURE_PORT: '4371'
          UI_WEB_PORT: '3171'
        run: npm run test:record -- e2e --config tests/ui/playwright.alt.config.ts --workers=1 tests/ui/ui-fix-01-visual.spec.ts
      - name: Verify all proof outcomes
        if: always()
        env:
          ADDRESSED: ${{ steps.addressed.outcome }}
          RUNTIME: ${{ steps.runtime.outcome }}
          REGRESSION: ${{ steps.regression.outcome }}
          BEFORE: ${{ steps.before.outcome }}
          AFTER: ${{ steps.after.outcome }}
          STALE_RED: ${{ steps.stale_red.outcome }}
          NEW_DRAFT_RED: ${{ steps.new_draft_red.outcome }}
        run: test "$ADDRESSED" = success && test "$RUNTIME" = success && test "$REGRESSION" = success && test "$BEFORE" = success && test "$AFTER" = success && test "$STALE_RED" = success && test "$NEW_DRAFT_RED" = success
      - name: Collect safe verification records
        if: always()
        env:
          PROOF_ADDRESSED: ${{ steps.addressed.outcome }}
          PROOF_RUNTIME: ${{ steps.runtime.outcome }}
          PROOF_REGRESSION: ${{ steps.regression.outcome }}
          PROOF_BEFORE: ${{ steps.before.outcome }}
          PROOF_AFTER: ${{ steps.after.outcome }}
          PROOF_STALE_RED: ${{ steps.stale_red.outcome }}
          PROOF_NEW_DRAFT_RED: ${{ steps.new_draft_red.outcome }}
        run: node tests/ui-fix-01-runtime/collect-checks.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-fix-01-proof-${{ github.sha }}
          path: |
            reports/ui-fix-01-2026-10-12/**/*.png
            ui-fix-01-baseline/reports/ui-fix-01-2026-10-12/**/*.png
            /tmp/ui-fix-01-runtime-screenshots/**/*.png
            reports/ui-fix-01-2026-10-12/remote-checks.json
          if-no-files-found: warn
          retention-days: 14
