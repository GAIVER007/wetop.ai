# Проверка кандидата в выкладку (ADR-139), единственная проверка GitHub в репозитории: lint, typecheck, unit,
# главная, тесты бота, база (миграции, integration, сквозные) и весь UI стойки, на раннерах GitHub. `release`
# перематывается только на коммит, у которого она зелёная (AGENTS.md §18). Своего раннера на боевом сервере больше
# нет: 03.10.2026 проверки там поднимали нагрузку до 85 при 2 ядрах и роняли стойку.
#
# Запуск (ADR-152, решение владельца 09.10.2026, автовыкладка): пуш кода в `main` (слияние PR), пуш в
# `release-candidate` или кнопка Actions → release-checks → Run workflow. Зелёный гейт на `main` перематывает
# `release` сам (auto-release.yml), дальше сервер забирает и выкладывает (ADR-080). Документы гейт не гоняют
# (paths-ignore): выкладки они не требуют. Один прогон стоит около 95 минут из 2000 бесплатных в месяц
# (бюджет Actions $0 со «Stop usage»); вершины main встают в очередь concurrency ниже. Свои наборы
# сессии по-прежнему гоняют сами до слияния (TESTING.md).
# Секретов здесь нет и не будет (SECURITY.md §3).
name: release-checks

on:
  workflow_dispatch:
  push:
    branches: [release-candidate, main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'plans/**'
      - 'reports/**'
      - 'tasks/**'
      - 'templates/**'
      - 'tests/runs/**'
      - 'outbox/**'
      - 'project-input/**'
      - 'Claude outputs/**'

# На main прогон не отменяется следующим слиянием, а ждёт в очереди: GitHub держит один идущий и один ожидающий
# (самый свежий), промежуточные вершины схлопываются. Иначе гейт около 95 минут не доходит до конца, когда слияния
# идут чаще: с 10.10.2026 по 11.10 из 59 прогонов на main 39 отменены, ни одного зелёного, release не двигался.
# Минут это не прибавляет: отменённый прогон тоже их тратит, только без итога. На прочих ветках новый прогон
# по-прежнему заменяет прежний: их итог release не перематывает.
concurrency:
  group: release-checks-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  fast:
    name: lint · typecheck · unit · главная
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run generate -w @pms/database
      - run: npm run lint
      - run: npm run typecheck && npm run typecheck:api && npm run typecheck:web
      - run: npx vitest run --project unit
      - name: Chromium для проверок главной
        run: npx playwright install --with-deps chromium
      - run: npm run site:check
      - name: Supplier payment source-component regressions (no database)
        run: npm run test:record -- e2e --config tests/supplier-component/playwright.config.ts --workers=1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: site-check-results
          path: |
            tests/site/test-results
            test-results
          if-no-files-found: ignore

  bot:
    name: бот · pytest
    # Тесты ИИ-продавца (apps/ai-seller). До 02.10.2026 их в проверках не было, и четыре теста покраснели
    # незамеченными (ADR-137, замечание ментора). Python ставит закреплённый uv; версия Python та же, что в образе
    # бота (apps/ai-seller/Dockerfile, сверяет tests/unit/ci-runner.test.ts). torch и sentence-transformers
    # не ставятся: тесты их не загружают, а с ними установка весит гигабайты.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      UV_VERSION: 0.12.21
      # Сумма из выпуска uv на GitHub (uv-x86_64-unknown-linux-gnu.tar.gz.sha256), меняется вместе с версией
      UV_SHA256: 23f02075b652bb1df64178cfae41b5caf160822e720e2663568f3f5d63bc52c0
      BOT_PYTHON: '3.13'
    defaults:
      run:
        working-directory: apps/ai-seller
    steps:
      - uses: actions/checkout@v4
      - name: uv закреплённой версии со сверкой суммы
        run: |
          curl -fsSL -o "$RUNNER_TEMP/uv.tar.gz" \
            "https://github.com/astral-sh/uv/releases/download/$UV_VERSION/uv-x86_64-unknown-linux-gnu.tar.gz"
          echo "$UV_SHA256  $RUNNER_TEMP/uv.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/uv.tar.gz" -C "$RUNNER_TEMP" --strip-components=1
          "$RUNNER_TEMP/uv" --version
      - name: Python и зависимости бота без torch
        run: |
          grep -v -E '^[[:space:]]*(torch|sentence-transformers|--extra-index-url)' requirements.txt \
            > "$RUNNER_TEMP/bot-requirements.txt"
          "$RUNNER_TEMP/uv" venv --python "$BOT_PYTHON" --python-preference only-managed "$RUNNER_TEMP/bot-venv"
          "$RUNNER_TEMP/uv" pip install --python "$RUNNER_TEMP/bot-venv/bin/python" \
            -r "$RUNNER_TEMP/bot-requirements.txt"
      - name: pytest бота
        run: |
          "$RUNNER_TEMP/bot-venv/bin/python" --version
          "$RUNNER_TEMP/bot-venv/bin/python" -m pytest -q -p no:cacheprovider

  db:
    name: миграции · integration · e2e на чистом PostgreSQL 16
    # при красных lint, typecheck или unit минуты на базу не тратятся
    needs: fast
    # Нужен `services: postgres`, то есть Docker внутри раннера: своему раннеру сокет Docker не даём, это root
    # на машине, где рядом боевая стойка и чужие проекты.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pms
          POSTGRES_PASSWORD: pms
          POSTGRES_DB: postgres
          # Вход по сети без пароля, как на стенде разработчика: тесты RLS ходят ролью wetop_app без пароля
          # (вход ей включает tests/tools/local-app-login.ts, только на локальной базе). Без этого postgres:16
          # требует пароль, и pg падал «client password must be a string» (прогон main 03.10.2026).
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Dedicated owned fixture required by all ten *-isolated integration specs. This is a separate
      # ephemeral cluster, not the migration/E2E service above; never apply held SQL to a live database.
      owner-home:
        image: postgres:16
        env:
          POSTGRES_USER: owner_home_test
          POSTGRES_DB: wetop_owner_home
          # Disposable CI-only credential, shared with PGPASSWORD for fixed URLs without a password.
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-owner-home-ci
          POSTGRES_HOST_AUTH_METHOD: scram-sha-256
          POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --encoding=UTF8
        ports: ['127.0.0.1:55516:5432']
        options: >-
          --health-cmd "pg_isready -U owner_home_test -d wetop_owner_home"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Клиент PostgreSQL 16 (psql, pg_dump той же мажорной версии, что сервер)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16
          psql --version && pg_dump --version
      # Зависимости ставятся до проверки миграций: она сверяет schema.prisma с базой из миграций CLI Prisma
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run generate -w @pms/database
      - name: Применение и откат каждой миграции, schema.prisma против базы из миграций
        env:
          MIGRATION_CHECK_URL: postgresql://pms:pms@127.0.0.1:5432/postgres
        run: |
          scripts/ops/check-migrations.sh
          EMPLOYEE_PORTAL_RESTORE_TEST_URL="$MIGRATION_CHECK_URL" npx vitest run --config tests/restore/employee-portal-grants-restore.config.ts
      # Дальше тесты на пустой базе: схему pms_test и данные (сид) они создают сами (tests/README.md)
      - run: psql postgresql://pms:pms@127.0.0.1:5432/postgres -c 'CREATE DATABASE pms_dev' -c '\c pms_dev' -c 'CREATE EXTENSION IF NOT EXISTS btree_gist'
      - name: Owned isolated integration fixture (canonical baseline, seed, six held SQL files)
        env:
          # Both provider/planner URLs are scoped to this step. No Prisma push or fabricated ledger.
          DATABASE_URL: postgresql://owner_home_test@127.0.0.1:55516/wetop_owner_home
          DIRECT_URL: postgresql://owner_home_test@127.0.0.1:55516/wetop_owner_home
          PGPASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-owner-home-ci
          TEST_DATA: seed
          CI: 'true'
          PMS_PORTAL_FIXTURE: owner-home-ci
          EXPENSE_LINKS_ENABLED: '0'
          BEAUTY_WORKLOAD_CAPTURE: 'false'
          HOSPITALITY_WORKLOAD_CAPTURE: 'false'
          RESTAURANT_CAPACITY_CAPTURE: 'false'
          RESTAURANT_OCCUPANCY_CAPTURE: 'false'
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS btree_gist WITH SCHEMA public'
          npm run test:schema
          # Real service/RLS acceptance on canonical schema BEFORE any held SQL is installed.
          npx tsx --tsconfig apps/api/tsconfig.json scripts/ci/check-owner-home-baseline.ts
          # Existing runner owns BEGIN/COMMIT and the exact order of all six apply files.
          PGOPTIONS='-c search_path=pms_test,public' psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 \
            -f packages/database/prisma/migrations-hold/owner-home-release.sql
          # Direct RLS clients use wetop_app with no URL password and inherit PGPASSWORD too.
          # This role change is confined to the disposable CI cluster; policies remain enabled.
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 <<'SQL'
          \getenv fixture_password PGPASSWORD
          SELECT format('ALTER ROLE wetop_app LOGIN PASSWORD %L', :'fixture_password') \gexec
          SQL
      - name: Интеграционные тесты
        env:
          # Explicit opt-in is scoped to the disposable canonical service, never arbitrary localhost.
          PMS_PORTAL_FIXTURE: owner-home-ci
          CI: 'true'
          # Keep default clients, global setup and explicit isolated pg/Prisma clients on one fixture.
          # The URL also carries the password for helpers that extract it to create local test roles.
          DATABASE_URL: postgresql://owner_home_test:${{ github.run_id }}-${{ github.run_attempt }}-owner-home-ci@127.0.0.1:55516/wetop_owner_home
          DATABASE_APP_URL: postgresql://wetop_app:${{ github.run_id }}-${{ github.run_attempt }}-owner-home-ci@127.0.0.1:55516/wetop_owner_home
          DIRECT_URL: postgresql://owner_home_test:${{ github.run_id }}-${{ github.run_attempt }}-owner-home-ci@127.0.0.1:55516/wetop_owner_home
          PGPASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-owner-home-ci
        # Vitest project excludes override CLI --exclude, so select the tracked files explicitly.
        # Portal fixtures run in the next step; no integration files are dropped.
        run: |
          set -euo pipefail
          mapfile -t integration_files < <(git ls-files 'tests/integration/*.test.ts' ':!:tests/integration/employee-portal*.test.ts')
          test "${#integration_files[@]}" -gt 0
          npx vitest run --project integration --passWithNoTests=false "${integration_files[@]}"
      - name: Интеграционные тесты портала на выделенной CI-базе
        env:
          DATABASE_URL: postgresql://pms:pms@127.0.0.1:5432/pms_dev
          DIRECT_URL: postgresql://pms:pms@127.0.0.1:5432/pms_dev
          PGPASSWORD: pms
          TEST_DATA: seed
        run: npx vitest run --project integration --passWithNoTests=false tests/integration/employee-portal
      - name: Сборка стойки и Chromium
        run: |
          npm run build -w apps/web
          npx playwright install --with-deps chromium
      - name: Unified owner home activation on real HTTP and canonical database
        env:
          DATABASE_URL: postgresql://pms:pms@127.0.0.1:5432/pms_dev
          APP_UNIFIED_OWNER_HOME: 'true'
          EXPENSE_LINKS_ENABLED: '0'
          BEAUTY_WORKLOAD_CAPTURE: 'false'
          HOSPITALITY_WORKLOAD_CAPTURE: 'false'
          RESTAURANT_CAPACITY_CAPTURE: 'false'
          RESTAURANT_OCCUPANCY_CAPTURE: 'false'
          PLAYWRIGHT_JSON_OUTPUT_FILE: owner-home-baseline-report.json
        run: |
          set -euo pipefail
          npm run test:schema -- --refresh
          npx playwright test tests/branches-ui/owner-home.spec.ts --config tests/branches-ui/playwright.config.ts --forbid-only --reporter=list,json
          node scripts/ci/check-playwright-report.mjs owner-home-baseline-report.json 3
      # Интеграционные тесты оставляют в pms_test свои строки (reservation-create-retry заводит ячейку на каждый
      # прогон), а сквозные сверяют сид число в число (88 ячеек): перед ними сид заново
      - name: Свежий сид pms_test для сквозных
        env:
          DATABASE_URL: postgresql://pms:pms@127.0.0.1:5432/pms_dev
        run: npm run test:schema -- --refresh
      - name: Мастер настройки, сохранение и восстановление в браузере
        env:
          DATABASE_URL: postgresql://pms:pms@127.0.0.1:5432/pms_dev
        run: npx playwright test --config tests/onboarding/playwright.config.ts
      - name: Сквозные тесты
        # Вошедшим пользователем (решение владельца 07.10.2026): после MV8 стойка без входа не угадывает гостиницу
        env:
          DATABASE_URL: postgresql://pms:pms@127.0.0.1:5432/pms_dev
          E2E_AUTH: '1'
        run: npx playwright test --workers=2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: |
            test-results
            owner-home-baseline-report.json
          if-no-files-found: ignore

  ui-shard:
    name: UI · часть ${{ matrix.shard }}/5
    needs: fast
    # Три части UI идут параллельно на двух ядрах GitHub. На своём раннере (боевой сервер) `next dev`
    # не поднимался за 120 с, а 812 тестов не помещались в 25 минут (03.10.2026).
    # Потолок 40 минут набор перерос вечером 03.10.2026: замер прогона 37153645955 дал часть 2/3 за
    # 23 минуты, часть 3/3 за 26, а часть 1/3 была срезана потолком на сороковой минуте, и сводная
    # задача краснела из-за отмены при двух зелёных соседях. `--shard` делит по числу тестов, а не по
    # времени, поэтому первая часть самая долгая. Если набор вырастет ещё, следующий шаг не потолок, а
    # четвёртая часть (`shard: [1, 2, 3, 4]` и `--shard=N/4`): общее время то же, стена короче.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Пять частей (13.10.2026): при трёх часть 3/3 одним worker не уложилась в 60 минут (38388304633); время
        # части задают тяжёлые спеки, а не число тестов, поэтому части мельче, потолок прежний
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run generate -w @pms/database
      # Раннер GitHub: системные библиотеки Chromium ставит сам Playwright (sudo здесь есть)
      - run: npx playwright install --with-deps chromium
      # Браузер: chromium Playwright (на Mac набор идёт в Chrome владельца); next dev и подставной API поднимает конфиг
      - name: Браузерные проверки без базы
        env:
          UI_BROWSER_CHANNEL: chromium
          # часть набора выбирает харнесс до раздачи файлов двум worker (tests/ui/worker-ports.ts, shardSpecs):
          # --shard Playwright отдавал первую часть целиком одному worker
          UI_SHARD: ${{ matrix.shard }}/5
          UI_RUNTIME_WORKERS: '1'
          # Observation only: correlate a real full-order duplicate with its incoming render.
          # This existing diagnostic is disabled in production and changes no cache or assertions.
          WETOP_DIAG_HOTEL_SETTINGS: ${{ matrix.shard == 1 && '1' || '0' }}
        # вход с включённым замком гоняет своя задача ui-auth (два worker), второй раз в первой части не нужен.
        # Один worker на часть: с двумя одновременно работающими стойками раннер на 2 ядра дважды подряд получал
        # shutdown signal посреди части 3/3 (release-checks 38377601835, попытки 2 и 3); баланс частей даёт UI_SHARD
        run: npx playwright test --config tests/ui/playwright.config.ts --workers=1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-results-${{ matrix.shard }}
          path: |
            test-results
            reports/ui-quality
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-visual-diffs-${{ matrix.shard }}
          path: test-results/design-system-*/**/*.png
          if-no-files-found: ignore

  ui-vertical:
    name: UI · ${{ matrix.suite }}
    needs: fast
    # Наборы салона, ресторана и филиалов (MV8.5 DS0a, решение владельца 07.10.2026): до этого их axe
    # и ширины 390/1440 гонялись только руками. Три набора идут параллельно с `db` и `ui-shard`,
    # стена гейта почти не растёт; минуты каждого записаны в отчёте среза. Подставные API наборов
    # читают схему pms_test локальной базы, поэтому у задачи своя служба postgres, как у `db`.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [beauty-ui, food-ui, branches-ui, employee-portal-ui]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pms
          POSTGRES_PASSWORD: pms
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://pms:pms@127.0.0.1:5432/pms_dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run generate -w @pms/database
      - name: База pms_dev и схема pms_test с миграциями
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16
          psql postgresql://pms:pms@127.0.0.1:5432/postgres -c 'CREATE DATABASE pms_dev' -c '\c pms_dev' -c 'CREATE EXTENSION IF NOT EXISTS btree_gist'
          npm run test:schema
      - run: npx playwright install --with-deps chromium
      - name: Браузерный набор на подставном API и настоящей схеме
        run: npx playwright test --config tests/${{ matrix.suite }}/playwright.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-vertical-${{ matrix.suite }}
          path: |
            tests/${{ matrix.suite }}/test-results
            test-results
          if-no-files-found: ignore

  ui-auth:
    name: Канонический вход и сохранённые login-lock требования
    needs: fast
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run generate -w @pms/database
      - run: npx playwright install --with-deps chromium
      - name: Все требования входа на двух изолированных workers
        env:
          UI_BROWSER_CHANNEL: chromium
        run: npx playwright test --config tests/ui/playwright.auth.config.ts --workers=2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-auth-results
          # только результаты Playwright; test-results/auth-runtime-* это сборки Next двух workers (десятки тысяч файлов)
          path: test-results/auth
          if-no-files-found: ignore

  onboarding-real:
    # Путь первого салона (17.10.2026): кнопка сайта «Начать работу», регистрация, подтверждение почты, настройка
    # салона, запись клиента и повторный вход на настоящих сайте, стойке, API и своей PostgreSQL с синтетическими
    # данными. Почта перехватывается в API набора (только @example.invalid), секретов и внешних отправок нет.
    # Серверы стенда поднимает конфиг набора из этого checkout (reuseExistingServer: false). Итог проверяется
    # отчётом: ноль выполненных, пропуски и нестабильные тесты не считаются успехом.
    name: путь первого салона на настоящих API и базе (tests/onboarding-real)
    needs: fast
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pms
          POSTGRES_PASSWORD: pms
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://pms:pms@127.0.0.1:5432/pms_dev
      DIRECT_URL: postgresql://pms:pms@127.0.0.1:5432/pms_dev
      DATABASE_APP_URL: postgresql://wetop_app@127.0.0.1:5432/pms_dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run generate -w @pms/database
      - name: База pms_dev и схема pms_test с миграциями
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16
          psql postgresql://pms:pms@127.0.0.1:5432/postgres -c 'CREATE DATABASE pms_dev' -c '\c pms_dev' -c 'CREATE EXTENSION IF NOT EXISTS btree_gist'
          npm run test:schema
          # Canonical migrations supply schema grants/RLS; LOGIN is only for this isolated trust service.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'ALTER ROLE wetop_app LOGIN NOSUPERUSER NOBYPASSRLS'
      - run: npx playwright install --with-deps chromium
      - name: Сайт, стойка, API и база одним стендом
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/onboarding-real-report.json
        run: npx playwright test --config tests/onboarding-real/playwright.config.ts --forbid-only --reporter=list,json
      - name: Выполнены все сценарии, без пропусков и повторов
        run: node scripts/ci/check-playwright-report.mjs onboarding-real-report.json 24
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: onboarding-real-results
          path: |
            test-results
            onboarding-real-report.json
          if-no-files-found: ignore

  runtime-audit:
    # Обязательный runtime-аудит денег, входа и схемы (A2, A23, A26, A29): настоящие API и PostgreSQL 16.14,
    # штатные роли, AUTH_REQUIRED=1, независимая SQL-сверка. База, API и тесты в одном сетевом пространстве с
    # loopback; у пространства нет внешних интерфейсов и маршрутов, connect() наружу сразу получает ENETUNREACH,
    # это проверяет и сам скрипт, и preload каждого API.
    # Исторический A3 (A3_RUNTIME_AUDIT) сюда не входит: reports/wetop-master-2026-10-10/audit-coverage.md
    name: runtime-аудит денег, входа и схемы без внешней сети
    needs: fast
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run generate -w @pms/database
      - run: npx playwright install --with-deps chromium
      - name: Подготовка с сетью (PostgreSQL 16.14 из npm, миграции, роли, вымышленные данные)
        run: scripts/ci/runtime-audit.sh prepare
      - name: Прогон в закрытом сетевом пространстве
        # каталог доказательств пустой: в репозитории лежат доказательства прежних локальных прогонов, в артефакт
        # должен попасть только этот (одноразовый checkout раннера)
        run: |
          rm -rf tests/runs/runtime-audit tests/runs/a2-runtime tests/runs/a23-runtime
          scripts/ci/runtime-audit.sh isolated
      - name: Записи журнала этого прогона (новые файлы, не из репозитория)
        if: always()
        run: |
          mkdir -p tests/runs/runtime-audit/journal
          git ls-files --others --exclude-standard -- tests/runs/entries tests/runs/logs | xargs -r cp -t tests/runs/runtime-audit/journal
          find test-results -name error-context.md -exec sh -c 'd="tests/runs/runtime-audit/failures/$(basename "$(dirname "$1")")"; mkdir -p "$d"; cp "$1" "$d/"' _ {} \; 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-audit-evidence
          # allowlist: доказательства сети и сверок, снимки A25, журнал этого прогона, контексты падений; без trace с cookie
          path: |
            tests/runs/runtime-audit/**/*.json
            tests/runs/runtime-audit/**/*.png
            tests/runs/runtime-audit/journal/*
            tests/runs/runtime-audit/failures/**/error-context.md
            tests/runs/a2-runtime/*.json
            tests/runs/a23-runtime/*.json
          if-no-files-found: ignore

  ui:
    # Сохраняем прежнее имя обязательной проверки; успешны должны быть все части.
    name: стойка на синтетическом API (tests/ui)
    needs: [ui-shard, ui-vertical, ui-auth]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Все части UI прошли
        env:
          UI_RESULT: ${{ needs.ui-shard.result }}
          VERTICAL_RESULT: ${{ needs.ui-vertical.result }}
          AUTH_RESULT: ${{ needs.ui-auth.result }}
        run: |
          test "$UI_RESULT" = success
          test "$VERTICAL_RESULT" = success
          test "$AUTH_RESULT" = success
