# Эталонные снимки дизайн-системы для Linux (`design/reference/kit/*-linux.png`) снимает только раннер GitHub
# (дополнение к ADR-139, 03.10.2026). Проверку `design-system.spec.ts` в release-checks гоняет тот же раннер: та же
# сборка Chromium и те же шрифты. Облачная сессия или свой сервер рисуют текст иначе, и снятые там эталоны расходятся
# с раннером (эталоны от 29.09 разошлись с ним на всю ширину секции после верхнего меню ADR-134).
# Запуск: Actions → ui-snapshots → Run workflow на нужной ветке. Новые эталоны приходят отдельной веткой
# `ci/ui-snapshots-<номер запуска>`, её вливают в main обычным порядком. В main и release этот файл не пишет.
name: ui-snapshots

on:
  workflow_dispatch:

concurrency:
  group: ui-snapshots-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kit:
    if: ${{ github.ref_name != 'fix/publish-unified-owner-home-20261017' }}
    name: эталоны дизайн-системы (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      # только для ветки с новыми эталонами (шаг ниже); проверки запускает release-checks, у него права на чтение
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run generate -w @pms/database
      - run: npx playwright install --with-deps chromium
      - name: Снимки секций дизайн-системы с перезаписью разошедшихся
        env:
          UI_BROWSER_CHANNEL: chromium
        run: >-
          npx playwright test --config tests/ui/playwright.config.ts design-system.spec.ts
          --grep "эталонные снимки" --update-snapshots=changed
      - name: Новые эталоны отдельной веткой
        env:
          BRANCH: ci/ui-snapshots-${{ github.run_number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'design/reference/kit/*-linux.png'
          if git diff --cached --quiet; then
            echo "Эталоны совпадают с раннером, ветка не нужна" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "test(ui): design-system -linux references from the GitHub runner (ui-snapshots #${{ github.run_number }})"
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "Новые эталоны: ветка $BRANCH" >> "$GITHUB_STEP_SUMMARY"

  # TEMPORARY branch-only compactness verification. Restore exact original before final full CI.
  beauty-compact:
    if: ${{ github.ref_name == 'fix/publish-unified-owner-home-20261017' }}
    name: beauty compact · existing case only
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pms
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://pms@127.0.0.1:5432/pms_dev
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run generate -w @pms/database
      - name: Same isolated CI database and canonical schema as vertical suite
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16
          psql postgresql://pms@127.0.0.1:5432/postgres -c 'CREATE DATABASE pms_dev' -c '\c pms_dev' -c 'CREATE EXTENSION IF NOT EXISTS btree_gist'
          npm run test:schema
      - run: npx playwright install --with-deps chromium
      - name: Existing compactness assertion and filter behavior, unchanged422 bound
        run: >-
          npx playwright test --config tests/beauty-ui/playwright.config.ts
          tz12-ui.spec.ts --grep 'calendar compact controls preserve filtering and hidden occupancy'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beauty-compact-probe
          path: |
            tests/beauty-ui/test-results
            test-results
          if-no-files-found: ignore
          retention-days: 7
