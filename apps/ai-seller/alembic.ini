# Alembic. URL базы здесь пустой: его задаёт окружение (см. migrations/env.py):
# -x url=..., иначе sqlalchemy.url отсюда, иначе настройки приложения.
# Секретов в этом файле нет и не будет.
[alembic]
# %(here)s — папка этого файла: миграции находятся и при чужой текущей директории
# (тесты меняют cwd ради журналов).
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s
sqlalchemy.url =
