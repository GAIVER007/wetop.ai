# Туннель на сервере (plans/server-kz-2026-09-17.md, шаг 4). Отличается от версии для Mac
# (scripts/ops/cloudflared-wetop.example.yml) ровно одним: внутри compose источник — не 127.0.0.1,
# а имена служб `api` и `web`.
#
# Куда положить: deploy/cloudflared/wetop.yml на сервере, рядом — файл ключа туннеля.
# Папка deploy/cloudflared/ в git не едет: в ней ключ (SECURITY.md §3).
#
#   1. на сервере: cloudflared tunnel login  →  выбрать wetop.ai
#   2. cloudflared tunnel delete --force wetop   — старая копия работает неизвестно где (18.09.2026), искать её
#      не нужно: без туннеля она подключиться не сможет. С этой секунды app/api.wetop.ai не отвечают — простой
#      на минуты, делать в момент шага 4 плана. На 22.09.2026 копия известна: Hostinger, 187.77.145.152 — её можно
#      не удалять, а остановить там и поднять здесь с тем же ключом туннеля (ключ переносит владелец;
#      docs/ops/server-setup-2026-09-18.md §8). Тогда шаги 1–4 не нужны
#   3. cloudflared tunnel create wetop           — новый TUNNEL-ID и файл ключа; положить в deploy/cloudflared/
#   4. cloudflared tunnel route dns --overwrite-dns wetop app.wetop.ai   (и то же для api.wetop.ai)
#      имена те же → webhook Channex не трогается; для ИИ-помощника — то же для assistant.wetop.ai, для вебхука
#      WhatsApp продавца — для seller.wetop.ai (docs/assistant/README.md §6, шаг 12)
#   5. подставить ниже TUNNEL-ID
#   6. docker compose -f deploy/compose.yml up -d cloudflared; проверить: cloudflared tunnel info wetop →
#      ровно один коннектор, linux_amd64, IP сервера
#
# Host не переписывать (httpHostHeader не задавать): серверные действия Next и проверка домена
# виджета ждут настоящий адрес.
#
# Cloudflare Access снят 20.09.2026 (ADR-053): вход — пароль приложения. Блок originRequest.access не ставить:
# с ним стойка не откроется без токена Access, которого больше нет (поправка 22.09.2026).

tunnel: <TUNNEL-ID>
credentials-file: /etc/cloudflared/<TUNNEL-ID>.json

ingress:
  - hostname: app.wetop.ai
    service: http://web:3000
  - hostname: api.wetop.ai
    path: ^/a/(pms\.js|hit)$
    service: http://api:3001
  - hostname: api.wetop.ai
    path: ^/w/(widget\.js|availability|book)$
    service: http://api:3001
  - hostname: api.wetop.ai
    path: ^/channels/channex/webhook$
    service: http://api:3001
  # ИИ-помощник (ADR-081, docs/assistant/README.md §3): наружу только чат (/widget/*) и живость (/health). Панель
  # бота и /internal/* — только внутренняя сеть wetop-internal.
  - hostname: assistant.wetop.ai
    path: ^/(widget/.*|health)$
    service: http://assistant:8000
  # ИИ-продавец (С3, SECURITY.md §11): наружу только вебхук WhatsApp — один путь на гостиницу, номер организации
  # строго uuid; кривой адрес получает 404 здесь и до бота не доходит. Чат продавца на сайт объекта — только когда
  # база бота в РК (ADR-009), его здесь нет; панель и /internal/* — только внутренняя сеть. На сервер правило
  # ставится шагом 12 docs/assistant/README.md §6; настоящий номер гостиницы — после базы бота в РК.
  - hostname: seller.wetop.ai
    path: ^/channels/whatsapp/webhook/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
    service: http://seller:8000
  - service: http_status:404
