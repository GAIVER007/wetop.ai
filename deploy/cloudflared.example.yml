# Туннель на сервере (plans/server-kz-2026-09-17.md, шаг 4). Отличается от версии для Mac
# (scripts/ops/cloudflared-wetop.example.yml) ровно одним: внутри compose источник — не 127.0.0.1,
# а имена служб `api` и `web`.
#
# Куда положить: deploy/cloudflared/wetop.yml на сервере, рядом — файл ключа туннеля.
# Папка deploy/cloudflared/ в git не едет: в ней ключ (SECURITY.md §3).
#
#   1. на сервере: cloudflared tunnel login  →  выбрать wetop.ai
#   2. cloudflared tunnel delete --force wetop   — старая копия работает неизвестно где (18.09.2026), искать её
#      не нужно: без туннеля она подключиться не сможет. С этой секунды app/api.wetop.ai не отвечают — простой
#      на минуты, делать в момент шага 4 плана
#   3. cloudflared tunnel create wetop           — новый TUNNEL-ID и файл ключа; положить в deploy/cloudflared/
#   4. cloudflared tunnel route dns --overwrite-dns wetop app.wetop.ai   (и то же для api.wetop.ai)
#      имена те же → webhook Channex и приложение Access не трогаются
#   5. подставить ниже TUNNEL-ID, имя команды Zero Trust и AUD-тег приложения Access
#   6. docker compose -f deploy/compose.yml up -d cloudflared; проверить: cloudflared tunnel info wetop →
#      ровно один коннектор, linux_amd64, IP сервера
#
# Host не переписывать (httpHostHeader не задавать): серверные действия Next и проверка домена
# виджета ждут настоящий адрес.

tunnel: <TUNNEL-ID>
credentials-file: /etc/cloudflared/<TUNNEL-ID>.json

ingress:
  - hostname: app.wetop.ai
    service: http://web:3000
    originRequest:
      access:
        required: true
        teamName: <имя-команды-zero-trust>
        audTag:
          - <AUD-тег-приложения-access>
  - hostname: api.wetop.ai
    path: ^/a/(pms\.js|hit)$
    service: http://api:3001
  - hostname: api.wetop.ai
    path: ^/w/(widget\.js|availability|book)$
    service: http://api:3001
  - hostname: api.wetop.ai
    path: ^/channels/channex/webhook$
    service: http://api:3001
  - service: http_status:404
