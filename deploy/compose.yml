# PMS на сервере в Казахстане (plans/server-kz-2026-09-17.md, plans/server-kz-2026-09-18.md). Заменяет launchd с
# Mac владельца: те же четыре службы, что держал launchd, только под Docker — как сторож на Hostinger
# (scripts/ops/watch/compose.yml).
#
#   api         — NestJS, 3001. Наружу не публикуется: до него ходит только туннель и стойка.
#   web         — стойка Next на `next start`, 3000. Тоже только через туннель.
#   cloudflared — именованный туннель: app.wetop.ai и api.wetop.ai. Адреса при переезде не меняются,
#                 меняется машина под туннелем, поэтому webhook Channex перерегистрировать не нужно.
#                 Поднимается ПОСЛЕ сверки двух баз, отдельно: up -d cloudflared (план, шаг 4).
#   exely-sync  — синхронизация с Exely (ADR-032), раз в 5 минут, как задача launchd на Mac
#                 (scripts/ops/launchd/install.sh: StartInterval 300, владелец 13.09.2026).
#
# Портов наружу НЕ публикуем (expose, не ports): снаружи объект виден только через туннель. Внутри сети
# compose службы зовут друг друга по имени, поэтому API и стойка слушают здесь 0.0.0.0 — на Mac умолчание
# прежнее, 127.0.0.1.
#
# Секреты — в файле .env в КОРНЕ клона (../.env отсюда), его вписывает владелец (SECURITY.md §3): оттуда же его
# читают main.ts, cli-check-env.ts и prisma migrate на хосте. Одно место, все читатели. В образ .env не попадает
# (.dockerignore), в контейнер идёт как env_file.
# База — управляемый PostgreSQL провайдера, в compose её нет намеренно: бэкапы и обновления на нём (Q-073).
# Боевой миграции в службах нет: её делает владелец руками (AGENTS.md §15).
#
# Запуск:   docker compose -f deploy/compose.yml up -d --build api web exely-sync
# Обновить: git pull && docker compose -f deploy/compose.yml up -d --build
# Смотреть: docker compose -f deploy/compose.yml ps ; docker compose -f deploy/compose.yml logs -f api
name: pms-lux

x-app: &app
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  image: pms-lux:latest
  restart: unless-stopped
  env_file:
    # Один .env на сервере — в корне клона. Копии в deploy/ нет намеренно: два файла разъезжаются.
    - path: ../.env
      required: true
    # Выключатель исходящего ARI (`scripts/ops/ari.sh stop|start`, CUTOVER.md ROLLBACK, шаг 1).
    # Файл есть — ARI выключен, файла нет — включён. В отличие от `launchctl setenv` на Mac,
    # это переживает перезагрузку сервера.
    - path: ari.env
      required: false
  security_opt: ['no-new-privileges:true']

# environment у служб не наследуется через &app (слияние YAML не глубокое), поэтому у каждой службы свой блок.
# TZ и NODE_ENV заданы в образе (Dockerfile), здесь только то, что различается.
services:
  api:
    <<: *app
    command: ['node', '--import', 'tsx', 'apps/api/src/main.ts']
    # На Mac API слушает только 127.0.0.1; в контейнере это «недоступен никому»: у каждой службы своя сеть.
    # 0.0.0.0 здесь виден только соседям по сети compose — порты наружу не публикуются.
    environment:
      API_HOST: '0.0.0.0'
      API_PORT: '3001'
    expose: ['3001']
    # Живость меряем публичным /health, который трогает базу. Рабочий маршрут сюда не годится:
    # с включённым AUTH_REQUIRED=1 он отвечает 401 без сессии, контейнер навсегда «нездоров»,
    # а стойка и туннель ждут его здоровья и не поднимаются вовсе. Проверка через node: она есть в любом
    # образе, wget/curl — нет.
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  web:
    <<: *app
    # Скрипт `start` в apps/web/package.json жёстко ставит --hostname 127.0.0.1 (так надо на Mac);
    # в контейнере стойка обязана слушать 0.0.0.0, иначе туннель её не увидит. Поэтому next запускается
    # напрямую из папки стойки, а не через npm-скрипт.
    working_dir: /app/apps/web
    command: ['npx', 'next', 'start', '--port', '3000', '--hostname', '0.0.0.0']
    environment:
      # Стойка ходит в API по имени службы; умолчание клиента (127.0.0.1:3001) в контейнере — это она сама
      APP_API_URL: http://api:3001
    expose: ['3000']
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      # /login отвечает и с замком APP_AUTH_REQUIRED=1, и без него; /today с замком уводит на вход
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # Ровно одна копия туннеля на весь проект. Две копии одного туннеля друг друга не заменяют:
  # Cloudflare делит запросы между ними, и адрес отвечает через раз (17.09.2026, docs/deploy.md §1).
  # Старый туннель гасится со стороны Cloudflare (tunnel delete --force) — deploy/cloudflared.example.yml.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ['tunnel', '--no-autoupdate', '--config', '/etc/cloudflared/wetop.yml', 'run']
    # Правила маршрутизации живут в репозитории и видны в ревью, а не в панели Cloudflare.
    # Ключ туннеля кладёт владелец рядом с конфигом; в git не едет.
    volumes: ['./cloudflared:/etc/cloudflared:ro']
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }

  # Пул на одно соединение: прогон последовательный, а лишние клиенты переполняют пулер
  # и роняют запросы стойки в 500 (15.09.2026, TESTING.md §1).
  # В день двойного ввода службу снимают: docker compose -f deploy/compose.yml stop exely-sync
  exely-sync:
    <<: *app
    command:
      - sh
      - -c
      - 'while true; do node --import tsx scripts/imports/src/cli-sync-day.ts --auto || true; sleep 300; done'
    environment:
      DATABASE_POOL_MAX: '1'
    depends_on:
      api: { condition: service_healthy }
