function stats(s){return s.stats?.length?`<div class="stats">${s.stats.slice(0,4).map(x=>`<div class="stat"><span>${esc(x.label)}</span><strong>${esc(x.value)}</strong></div>`).join('')}</div>`:''}
function tabs(s){return s.tabs?.length?`<div class="segmented" role="tablist" aria-label="Разделы экрана">${s.tabs.map((x,i)=>`<button role="tab" aria-selected="${i===0}" data-tab="${esc(x)}" class="${!i?'active':''}">${esc(x)}</button>`).join('')}</div>`:''}
function fields(s){return (s.fields||[]).map((f,i)=>`<label class="field">${esc(f.label)}${/комментар|замет|описан/i.test(f.label)?`<textarea placeholder="${esc(f.value)}"></textarea>`:`<input ${/пароль/i.test(f.label)?'type="password" autocomplete="current-password"':/почт/i.test(f.label)?'type="email" autocomplete="email"':'type="text"'} value="${esc(f.value)}" aria-label="${esc(f.label)}">`}${i===0?'<small>Пример заполнения, данные не сохраняются.</small>':''}</label>`).join('')}
function chart(){return `<div class="card chart"><div class="chart-label"><span>За последние 7 дней</span><span>Пример динамики</span></div><div class="bars">${[46,72,58,87,63,96,78].map((n,i)=>`<div class="bar ${i===5?'current':''}" style="height:${n}%"><span>${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'][i]}</span></div>`).join('')}</div>`}
function days(){return `<div class="days">${[19,20,21,22,23,24,25].map((n,i)=>`<button data-day="${n}" class="day ${n===24?'active':''}">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'][i]}<b>${n}</b></button>`).join('')}</div>`}
function timeline(s){return `<div class="timeline">${(s.rows||[]).map((r,i)=>`<div class="event"><span class="time">${['09:00','10:30','12:00','14:00','16:00'][i%5]}</span><button class="event-card" data-go="${esc(r.to||s.detail||matching(s,'detail'))}" style="text-align:left;color:var(--text)"><strong>${esc(r.title)}</strong><p>${esc(r.detail)}</p>${status(r.status||'Подтверждено')}</button></div>`).join('')}</div>`}
function auth(s){if(s.id==='login')return `<div class="auth-page"><div class="auth-logo"><span class="mark">w</span>WETOP</div><h2>Рады видеть<br>вас снова</h2><p>Ваш бизнес под рукой.<br>Войдите в рабочее пространство.</p><label class="field">Почта<input type="email" autocomplete="email" placeholder="name@example.com" aria-label="Почта"></label><label class="field">Пароль<span class="password-wrap"><input type="password" autocomplete="current-password" placeholder="Введите пароль" aria-label="Пароль"><button data-password>Показать</button></span></label><div style="text-align:right;margin:-8px 0 20px">${jump('reset','Забыли пароль?')}</div>${jump('business','Войти','primary')}<div class="auth-foot">Нет аккаунта? ${jump('register','Создать аккаунт')}<br>В этом прототипе не вводите настоящий пароль.</div><div class="info">Пример интерфейса. Кнопка «Войти» открывает демонстрационный выбор бизнеса.</div></div>`;return `<div class="auth-page"><div class="auth-logo"><span class="mark">w</span>WETOP</div><h2>${esc(s.title)}</h2><p>${esc(s.subtitle)}</p>${fields(s)}${jump(s.next||'login',esc(s.action||'Продолжить'),'primary')}<div class="auth-foot">${jump('login','Вернуться ко входу')}</div></div>`}
function content(s){if(stateOverride)return stateContent(stateOverride);switch(s.type){case'auth':return auth(s);case'dashboard':{let a=s.stats||[];return `<div class="card summary"><small>${esc(a[0]?.label||'Рабочий день')}</small><div class="big">${esc(a[0]?.value||'Сегодня')}</div><div class="summary-bottom">${a.slice(1,3).map(x=>`<div>${esc(x.label)}<strong>${esc(x.value)}</strong></div>`).join('')}</div></div><div style="display:flex;gap:8px;margin:14px 0">${jump(s.next||matching(s,'form'),icon('plus')+' '+esc(s.action||'Создать'),'primary')}${jump(matching(s,'calendar'),icon('calendar'),'icon-btn')}</div><div class="section-head"><h3>${s.group==='food'?'Заказы в работе':s.group==='hostel'?'Ближайшие заезды':'Ближайшие записи'}</h3>${jump(matching(s,'list'),'Все')}</div>${rows(s)}<div class="info">${esc(s.note||'Все важные события вашей смены в одном месте.')}</div>`}case'calendar':if(s.id==='h-chessboard'||s.id==='h-availability')return tabs(s)+days()+`<div class="info">Номера и койки · 24–27 октября. Нажмите на размещение.</div><div class="stay-grid"><span class="date">Место</span>${[24,25,26,27].map(x=>`<span class="date">${x} окт</span>`).join('')}${['04-1','04-2','04-3','04-4','05-1','05-2'].map((n,i)=>`<strong>${n}</strong>${[0,1,2,3].map(j=>`<button data-go="${(i+j)%3?'h-reservation-detail':'h-reservation-create'}" class="${(i+j)%3?'booked':'free'}">${(i+j)%3?'Гость '+(i+1):'Своб.'}</button>`).join('')}`).join('')}</div><div class="section-head"><h3>События дня</h3></div>`+rows(s);return tabs(s)+days()+`<div class="section-head"><h3>Суббота, 24 октября</h3><span class="pill">${(s.rows||[]).length} события</span></div>`+timeline(s);case'floor':return tabs(s)+`<div class="info">${status('Свободно')} &nbsp;${status('В работе')} &nbsp;${status('Ожидают')}</div><div class="floor">${Array.from({length:9},(_,i)=>`<button class="table ${i%3?'busy':''}" data-go="${esc(s.next||matching(s,'detail'))}"><b>${String(i+1).padStart(2,'0')}</b><small>${i%3?'2 гостя · 18 мин':'Свободен'}</small></button>`).join('')}</div><div class="section-head"><h3>Ожидаемые гости</h3>${status('2 брони')}</div>${rows(s)}`;case'kitchen':return tabs(s)+(s.rows||[]).map((r,i)=>`<div class="kitchen-ticket"><div class="ticket-top"><span>${esc(r.title)}</span><span>${8+i*4} мин</span></div><div class="ticket-body">${esc(r.detail)}<br><small>Комментарий: без острого соуса</small><hr style="border:0;border-top:1px solid var(--line)">${status(r.status)}<div style="margin-top:13px"><button class="primary secondary" data-demo="Изменение статуса показано в макете">${i?'Готово к выдаче':'Начать готовить'}</button></div></div></div>`).join('');case'form':return tabs(s)+`<div class="card">${fields(s)}</div><div class="info">${esc(s.note||'Проверьте детали перед подтверждением. Это пример формы, данные не отправляются.')}</div>`;case'detail':return `<div class="card"><div class="profile-avatar">${icon(s.group==='hostel'?'bed':s.group==='food'?'food':'users')}</div>${status(s.badge||'Подтверждено')}<dl class="details">${(s.fields||[]).map(f=>`<div><dt>${esc(f.label)}</dt><dd>${esc(f.value)}</dd></div>`).join('')}</dl></div>${tabs(s)}${rows(s)}${s.note?`<div class="info">${esc(s.note)}</div>`:''}`;case'report':return tabs(s)+stats(s)+chart()+`<div class="section-head"><h3>Подробности</h3><span class="pill">Октябрь</span></div>`+rows(s);case'inventory':return tabs(s)+stats(s)+(s.id.includes('bed')||s.id.includes('room')?`<div class="card"><strong>Номер 04 · 6 мест</strong><div class="bed-grid">${Array.from({length:6},(_,i)=>`<button class="bed ${i<4?'occupied':''}" data-go="${esc(s.next||matching(s,'detail'))}">${icon('bed')}Место ${i+1}<br>${i<4?'Занято':'Свободно'}</button>`).join('')}</div></div>`:'')+rows(s);case'settings':return `<div class="card">${(s.fields||[]).map(f=>`<div class="check-row"><span>${esc(f.label)}<small style="display:block;color:var(--secondary);font-size:11px">${esc(f.value)}</small></span>${s.id==='appearance'||s.id==='permissions'||s.id==='payment-methods'?`<button class="toggle" aria-label="${esc(f.label)}" aria-pressed="true" data-toggle></button>`:icon('chevron')}</div>`).join('')}</div>`+rows(s);case'state':if(s.id==='reset-sent')return `<div class="empty"><div class="empty-icon">${icon('check')}</div><h3>Проверьте почту</h3><p>Если аккаунт существует, мы отправим инструкцию. В прототипе письмо не отправляется.</p>${jump('login','Вернуться ко входу','primary')}</div>`;return stateContent(s.id==='payment-success'?'success':s.id.replace('state-',''));case'menu':return `<div class="card"><strong>Рабочее пространство</strong><p style="color:var(--secondary);font-size:12px">Бизнес и филиал можно переключить</p>${jump('business','Выбрать бизнес','primary secondary')}</div><div class="rows card">${screens.filter(x=>(x.group===(s.forGroup||contextGroup)&&['list','report','settings','calendar','inventory','floor','kitchen'].includes(x.type))||['finance','cashbox','team','payroll','warehouse','marketing','settings','help','profile'].includes(x.id)).map(x=>`<button class="row" data-go="${x.id}"><span class="avatar">${icon(x.type==='report'?'chart':x.type==='settings'?'settings':'box')}</span><span class="row-main"><strong>${esc(x.title)}</strong><small>${esc(x.section)}</small></span>${icon('chevron')}</button>`).join('')}</div>`;default:return tabs(s)+`<div class="mini-search">${icon('search')}<input aria-label="Поиск по списку" placeholder="Поиск по названию" data-row-search></div>`+stats(s)+rows(s)}}
function stateContent(id){let x={loading:['clock','Загружаем данные','Подготавливаем ваше рабочее пространство.'],empty:['box','Здесь пока пусто','Добавьте первую запись. Она появится в этом разделе.'],offline:['wifi','Нет соединения','Проверьте интернет. Данные не отправлены, введённое сохранено.'],forbidden:['shield','Нет доступа','Обратитесь к владельцу бизнеса, чтобы уточнить ваши права.'],error:['bell','Не удалось загрузить','Попробуйте ещё раз. Если ошибка повторится, свяжитесь с поддержкой.'],success:['check','Готово','Пример подтверждения выполненного действия.'],confirm:['logout','Выйти из аккаунта?','На этом устройстве потребуется снова войти.']}[id]||['clock','Состояние','Пример интерфейса'];return `<div class="empty"><div class="empty-icon">${icon(x[0])}</div><h3>${x[1]}</h3><p>${x[2]}</p>${!['loading','forbidden'].includes(id)?`<button class="primary" data-clearstate>${id==='confirm'?'Выйти':id==='empty'?'Добавить':id==='success'?'Продолжить':'Повторить'}</button>`:''}</div>`}
function phone(s){const authScreen=s.type==='auth';const preContext=s.id==='business'||s.id.startsWith('branch-')||s.id.startsWith('onboarding');let g=['beauty','food','hostel'].includes(s.group)?s.group:(s.forGroup||contextGroup);const b=screens.find(x=>x.group===g&&x.type==='dashboard');const work=screens.find(x=>x.group===g&&['calendar','floor'].includes(x.type));const cust=screens.find(x=>x.group===g&&/клиент|гост/i.test(x.title)&&x.type==='list');return `<div class="phone ${dark?'dark':''}"><div class="statusbar"><span>9:41</span><span class="signals">● ▰ <i></i></span></div>${authScreen?'':preContext?`<header class="app-head"><button class="icon-btn" data-back aria-label="Назад">${icon('back')}</button><strong>WETOP · рабочее пространство</strong></header>`:`<header class="app-head"><button class="icon-btn" data-back aria-label="Назад">${icon('back')}</button><button data-go="business" style="background:none;text-align:left;color:var(--text);flex:1"><small>WETOP · ${esc(labels[g])}</small><strong>${g==='beauty'?'Салон «Линия»':g==='food'?'Бистро «Двор»':'Хостел «Место»'} ⌄</strong></button>${jump('notifications',icon('bell'),'icon-btn')}</header>`}<div class="screen-scroll">${authScreen?'':`<div class="page-top"><div class="eyebrow">${esc(s.section||'Рабочее пространство')}</div><h2>${esc(s.title)}</h2><p>${esc(s.subtitle||'24 октября · суббота')}</p></div>`}${content(s)}</div>${s.action&&!['auth','dashboard','state'].includes(s.type)?`<div class="actions">${jump(s.next||matching(s,'form'),esc(s.action),'primary')}</div>`:''}${authScreen||preContext?'':`<nav class="bottom-nav" aria-label="Навигация приложения">${[[b?.id||'business','home','Сегодня'],[work?.id||'business',g==='food'?'food':'calendar',g==='food'?'Зал':'Календарь'],[cust?.id||'business','users',g==='hostel'?'Гости':'Клиенты'],['menu-'+g,'menu','Ещё']].map(([id,ic,title])=>`<button class="nav-item ${s.id===id?'active':''}" data-go="${id}">${icon(ic)}<span>${title}</span></button>`).join('')}</nav>`}<div class="demo-tag">ДИЗАЙН-ПРОТОТИП · ВЫМЫШЛЕННЫЕ ДАННЫЕ</div></div>`}
function visible(){return screens.filter(s=>(filter==='all'||s.group===filter)&&(!query||(s.title+' '+s.section+' '+s.route).toLowerCase().includes(query.toLowerCase())))}
function render(){let s=screens.find(x=>x.id===selected)||screens[0];$('#screen-count').textContent=`${screens.length} экранов · единый визуальный язык`;$('#screenlist').innerHTML=Object.entries(labels).map(([g,l])=>{let a=visible().filter(s=>s.group===g);return a.length?`<div class="group-title">${l} · ${a.length}</div>${a.map(x=>`<button class="screenlink ${x.id===s.id?'active':''}" data-go="${x.id}"><span>${String(screens.indexOf(x)+1).padStart(2,'0')}</span>${esc(x.title)}</button>`).join('')}`:''}).join('');$('#filters').innerHTML=[['all','Все'],['common','Общее'],['beauty','Салон'],['food','Ресторан'],['hostel','Хостел'],['platform','Платформа']].map(([id,t])=>`<button class="${filter===id?'active':''}" data-filter="${id}">${t}</button>`).join('');document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x.dataset.view===view));$('#page-title').textContent=view==='atlas'?'Альбом всех экранов':view==='compare'?'Три направления. Одна платформа.':s.title;$('#page-subtitle').textContent=view==='single'?`${labels[s.group]} · ${screens.indexOf(s)+1} / ${screens.length}`:'WETOP Mobile · визуальная концепция · 24 октября 2026';const notes=s.type==='auth'?['Вход с видимыми подписями полей','Системное автозаполнение и показ пароля','Рабочее меню появляется после входа']:['Общие отступы, типографика и элементы управления','Доступные действия зависят от серверных прав','Контекст бизнеса виден на каждом рабочем экране'];$('#workspace').innerHTML=view==='atlas'?`<div class="atlas">${visible().map(x=>`<article class="atlas-item" data-open="${x.id}" tabindex="0" role="button" aria-label="Открыть ${esc(x.title)}"><div class="atlas-window">${phone(x)}</div><strong>${esc(x.title)}</strong><small>${labels[x.group]} · ${esc(x.section)}</small></article>`).join('')}</div>`:view==='compare'?`<div class="compare">${['beauty','food','hostel'].map(g=>{let x=screens.find(x=>x.group===g&&x.type==='dashboard');return x?`<section><div class="compare-title">${labels[g]}<small>Сегодня</small></div>${phone(x)}</section>`:''}).join('')}</div>`:`<div class="preview-grid">${phone(s)}<aside class="spec-note"><span class="kicker">WETOP / Mobile design</span><h2>${esc(s.title)}</h2><p>${esc(s.subtitle)}</p><div class="note-block"><h3>Назначение экрана</h3><p>${esc(s.description||s.note||'Мобильное представление раздела платформы. Главные действия доступны большим пальцем, вторичные детали раскрываются по нажатию.')}</p><ul>${notes.map(n=>`<li>${n}</li>`).join('')}</ul></div><div class="note-block"><h3>Источник в платформе</h3><div class="note-route">${esc(s.route||'Общая оболочка мобильного приложения')}</div><p style="font-size:12px">Макет показывает структуру и взаимодействия. Суммы, имена и статусы вымышлены. Реальная авторизация и операции здесь не выполняются.</p></div><div class="note-block"><h3>Состояния этого экрана</h3><div class="state-buttons">${[['loading','Загрузка'],['empty','Пусто'],['offline','Нет сети'],['forbidden','Нет доступа'],['error','Ошибка']].map(([id,t])=>`<button data-state="${id}">${t}</button>`).join('')}<button data-clearstate>Обычный вид</button></div></div><div class="step-links"><button data-prev>← Предыдущий</button><button data-next>Следующий →</button></div></aside></div>`;}
function go(id){if(!screens.some(x=>x.id===id)){toast('Этот переход показывает действие в макете.');return}history.push(selected);selected=id;const dest=screens.find(x=>x.id===id);if(['beauty','food','hostel'].includes(dest.group))contextGroup=dest.group;else if(dest.forGroup)contextGroup=dest.forGroup;stateOverride=null;view='single';location.hash=id;render();}
let timer;function toast(text){$('#toast').textContent=text;$('#toast').classList.remove('hidden');clearTimeout(timer);timer=setTimeout(()=>$('#toast').classList.add('hidden'),3500)}
