</style><header><h1>WETOP: CSS-фундамент DS0b</h1><p>48 основных пар: 12 экранов, две темы, компьютер и телефон. Дополнительно 16 пар с услугами, клиентами и панелями. Все данные тестовые. Часы и даты создания записей могут отличаться.</p><p><a href="README.md">Отчёт и границы проверки</a></p><label for="screen">Экран, ширина и тема</label><select id="screen"></select></header><main><figure><figcaption>До</figcaption><a id="beforeLink"><img id="before" alt="Экран до изменений"></a></figure><figure><figcaption>После</figcaption><a id="afterLink"><img id="after" alt="Экран после изменений"></a></figure></main><script>
