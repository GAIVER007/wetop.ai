# УСТАРЕЛ (14.09.2026): для домена wetop.ai — scripts/ops/cloudflared-wetop.example.yml (стойка за Access + API,
# без демо-страниц, служба launchd `domain`). Этот общий рецепт оставлен для истории решения Q-112.
# Постоянный публичный адрес API (Q-112) — именованный туннель Cloudflare вместо быстрого.
# Быстрый туннель (`cloudflared tunnel --url`) меняет адрес при каждом перезапуске и пробрасывает весь порт;
# именованный держит один адрес и наружу выпускает только нужные пути (SECURITY.md §11).
#
# Шаги (один раз, делает владелец — нужен домен, добавленный в аккаунт Cloudflare, бесплатный план подходит):
#   1. cloudflared tunnel login                       # браузер → выбрать домен
#   2. cloudflared tunnel create pms                  # напечатает TUNNEL-ID и путь к credentials-file
#   3. cloudflared tunnel route dns pms pms.<домен>   # запись pms.<домен> → туннель
#   4. скопировать этот файл в ~/.cloudflared/config.yml, подставить TUNNEL-ID, путь и домен
#   5. cloudflared tunnel run pms                     # или как служба: sudo cloudflared service install
#   6. в .env вписать PUBLIC_API_URL=https://pms.<домен>  (значение вписывает владелец, SECURITY.md §3)
#   7. перезапустить API; на /channels нажать «Зарегистрировать webhook»; код счётчика (/website/settings)
#      и виджета (/website/booking) сам покажет новый адрес — обновить две строки на сайте.
#
# Наружу выходят ТОЛЬКО: /a/* (счётчик), /w/* (виджет), webhook Channex. Всё остальное — 404.

tunnel: <TUNNEL-ID>
credentials-file: /Users/<пользователь>/.cloudflared/<TUNNEL-ID>.json

ingress:
  - hostname: pms.<домен>
    path: ^/a/.*
    service: http://localhost:3001
  - hostname: pms.<домен>
    path: ^/w/.*
    service: http://localhost:3001
  - hostname: pms.<домен>
    path: ^/channels/channex/webhook$
    service: http://localhost:3001
  - service: http_status:404
