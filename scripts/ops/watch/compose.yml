# «Сторож сторожа» — отдельный Docker-проект на общем сервере Hostinger (plans/slice-12-guard-server.md).
# Чужие контейнеры (vilkabot2, hermes-workspace, traefik) не трогаем.
#
# Проверено на сервере 13.09.2026: Traefik работает в сети хоста (network_mode: host), docker-провайдер с
# exposedbydefault=false, точка входа https — `websecure`, сертификаты — резолвер `letsencrypt`; любое имя
# *.<имя сервера> указывает на сервер. Поэтому своей сети Traefik не нужно: он достаёт контейнер по его IP.
#
# Секреты — в файле .env рядом (вписывает владелец): WATCH_SECRET, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, а также WATCH_HOST
# (имя сторожа на сервере; в открытый репозиторий не пишем, 19.10.2026).
name: pms-lux-watch
services:
  watch:
    build: .
    restart: unless-stopped
    env_file: .env
    read_only: true
    security_opt: ['no-new-privileges:true']
    mem_limit: 128m
    labels:
      - traefik.enable=true
      - traefik.http.routers.pms-lux-watch.rule=Host(`${WATCH_HOST:?впишите WATCH_HOST в .env}`)
      - traefik.http.routers.pms-lux-watch.entrypoints=websecure
      - traefik.http.routers.pms-lux-watch.tls.certresolver=letsencrypt
      - traefik.http.services.pms-lux-watch.loadbalancer.server.port=8080
