# Отдельный Docker-проект на общем сервере Hostinger: чужие контейнеры (vilkabot2, hermes, traefik) не трогаем.
# Маршрут наружу — метками для уже работающего Traefik; имя хоста и сеть Traefik уточняются на сервере (WATCH_HOST, TRAEFIK_NETWORK).
# Секреты — в файле .env рядом (вписывает владелец): WATCH_SECRET, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID.
name: pms-lux-watch
services:
  watch:
    build: .
    restart: unless-stopped
    env_file: .env
    read_only: true
    security_opt: ['no-new-privileges:true']
    labels:
      - traefik.enable=true
      - traefik.http.routers.pms-lux-watch.rule=Host(`${WATCH_HOST}`)
      - traefik.http.routers.pms-lux-watch.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.pms-lux-watch.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.services.pms-lux-watch.loadbalancer.server.port=8080
    networks: [traefik]
networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}
