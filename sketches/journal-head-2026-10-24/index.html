    status: { label: 'Статус брони', all: 'Все статусы', items: ['Ждём', 'Подтверждена', 'Сидят', 'Ушли', 'Не пришли'] },
    more: [['Гостей', ['Любое число', '1–2', '3–4', '5 и больше']], ['Время плана', ['Сейчас', '19:00', '20:00', '21:00']], ['Источник', ['Все', 'Сайт', 'Звонок', 'Без брони']]],
    views: ['План зала', 'Расписание'],
    extra: '<button class="btn wide-only">Посадить без брони</button>',
    board: { head: ['Столы', '18:00', '19:00', '20:00', '21:00', '22:00'],
      rows: [['Стол 1 (4)', '<span class="plate p1">Сидят: Ерлан, 4</span>', '', '', '<span class="plate p2">Асхат, 2</span>', ''], ['Стол 2 (2)', '', '<span class="plate p2">Алина, 2</span>', '', '', ''], ['Стол 7 (6)', '', '', '<span class="plate p3">Ждём: Нурсултан, 6</span>', '', ''], ['VIP 1 (8)', '', '', '', '', '<span class="plate p4">Уборка</span>']] },
  },
};

let state = { h: 'A', v: 'hotel', d: 'desk', who: '', what: '', status: '', q: '', view: 0, pop: '' };

function select(conf, key) {
  if (!conf) return '';
  const val = state[key];
  const opts = ['<option value="">' + conf.all + '</option>'].concat(conf.items.map((i) => '<option' + (val === i ? ' selected' : '') + '>' + i + '</option>')).join('');
  return '<select class="sel wide' + (val ? ' on' : '') + '" aria-label="' + conf.label + '" data-k="' + key + '">' + opts + '</select>';
}

function render() {
  const c = V[state.v];
  const phone = state.d === 'phone';
  const active = ['who', 'what', 'status'].filter((k) => state[k]).length;
  const whoBtn = c.who.icon
    ? '<span class="who-wrap wide">' + I.user + '<button class="sel' + (state.who ? ' on' : '') + '" data-pop="who" style="text-align:left;padding-left:34px">' + (state.who || c.who.all) + '</button>' +
      '<div class="pop whopop' + (state.pop === 'who' ? ' show' : '') + '"><input placeholder="Найти специалиста"><ul>' +
      ['', ...c.who.items].map((n) => '<li data-who="' + n + '" class="' + (state.who === n ? 'on' : '') + '">' + (n ? '<span class="av">' + n.split(' ').map((w) => w[0]).join('') + '</span>' + n + '<small>3 записи</small>' : '<span class="av">★</span>' + c.who.all) + '</li>').join('') +
      '</ul></div></span>'
    : select(c.who, 'who');
  const what = state.v === 'food'
    ? '<span class="shifts wide">' + c.what.items.map((s) => { const [n, t] = s.split(' '); return '<button class="shift" data-shift="' + s + '" aria-pressed="' + (state.what === s) + '"><b>' + n + '</b><small>' + t + '</small></button>'; }).join('') + '</span>'
    : select(c.what, 'what');
  const chips = ['who', 'what', 'status'].filter((k) => state[k]).map((k) => '<button class="chip" data-clear="' + k + '">' + state[k] + I.x + '</button>').join('');
  const datePop = '<div class="pop datepop' + (state.pop === 'date' ? ' show' : '') + '"><div class="pp"><div class="presets">' +
    (c.mode === 'period' ? ['Сегодня', 'Эта неделя', '7 дней', '14 дней', 'Этот месяц', 'Свой период'] : ['Сегодня', 'Завтра', 'Эта неделя', 'Выходные', 'Через неделю', 'Выбрать день']).map((p, i) => '<button class="' + (i === (c.mode === 'period' ? 1 : 0) ? 'on' : '') + '">' + p + '</button>').join('') +
    '</div><div><div class="cal-head"><button class="btn icon" style="height:30px;width:30px">' + I.left + '</button>Октябрь 2026<button class="btn icon" style="height:30px;width:30px">' + I.right + '</button></div><div class="cal">' +
    ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'].map((d) => '<span class="h">' + d + '</span>').join('') +
    '<span class="muted">28</span><span class="muted">29</span><span class="muted">30</span>' +
    Array.from({ length: 31 }, (_, i) => { const d = i + 1; let cl = 'd'; if (c.mode === 'period') { if (d === 19 || d === 25) cl += ' sel1'; else if (d > 19 && d < 25) cl += ' in'; } else if (d === 24) cl += ' sel1'; if (d === 24 && c.mode === 'period') cl += ' today'; return '<span class="' + cl + '">' + d + '</span>'; }).join('') +
    '</div></div></div>' + (c.mode === 'period' ? '<div class="foot"><span style="margin-right:auto;color:var(--muted);align-self:center">19–25 октября, 7 дней</span><button class="btn">Отмена</button><button class="btn primary">Показать</button></div>' : '<div class="foot"><span style="margin-right:auto;color:var(--muted);align-self:center">Щелчок по дню сразу открывает его</span></div>') + '</div>';
  const period = (cls) => '<div class="period ' + (cls || '') + '"><button class="main" data-pop="date">' + I.cal + (phone ? c.dateShort : c.date) + I.down + '</button><button class="arrow" aria-label="Назад">' + I.left + '</button><button class="arrow" aria-label="Вперёд">' + I.right + '</button></div>';
  const filterPop = '<div class="pop filterpop' + (state.pop === 'filters' ? ' show' : '') + '"><h4>Фильтры</h4>' +
    (phone ? [c.who, c.what, c.status].filter(Boolean).map((f) => '<label>' + f.label + '<select class="sel"><option>' + f.all + '</option>' + f.items.map((i) => '<option>' + i + '</option>').join('') + '</select></label>').join('') : '') +
    c.more.map(([l, o]) => '<label>' + l + '<select class="sel">' + o.map((x) => '<option>' + x + '</option>').join('') + '</select></label>').join('') +
    (phone ? '<label>Отчёт<button class="btn">' + I.report + 'Быстрый отчёт</button></label>' : '') +
    '<div class="row"><button class="btn" data-reset>Сбросить</button><button class="btn primary" data-close>Готово</button></div></div>';

  const html =
    '<div class="' + (phone ? 'phone phone-frame' : 'app') + '">' +
    '<div class="topbar"><div class="logo"><i>W</i>WETOP<span>.AI</span></div>' +
      (state.h === 'old'
        ? '<div class="gsearch">' + I.search + 'Поиск клиента, раздела…</div>'
        : '<div class="clock" title="Время филиала"><b>' + (phone ? '24 окт.' : '24 октября') + '</b><span id="clk">20:00</span><small>суббота</small></div>' +
          (state.h === 'B' ? '<button class="btn icon gicon" title="Поиск по системе, Ctrl K">' + I.search + '</button>' : '<span style="margin-left:auto"></span>')) +
      '<div class="branch"><b>' + c.branch[0] + '</b>' + c.branch[1] + '</div><div class="user">Администратор</div></div>' +
    '<nav class="menu">' + ['Главная', c.menu === 'Календарь' ? 'Календарь' : 'Журнал', 'Персонал', 'Клиенты', 'Услуги', 'Статистика', 'Склад', 'Финансы', 'Настройки', 'Продвижение'].map((m, i) => '<a href="#" class="' + (i === 1 ? 'on' : '') + '">' + m + '</a>').join('') + '</nav>' +
    '<main><section class="jh" aria-label="Шапка журнала">' +
      '<div class="jh-top"><div><div class="jh-title">' + I.board + c.title + '</div><div class="jh-sub">' + c.sub + '</div></div>' +
      '<div class="jh-actions">' + period() + datePop +
        (c.full ? '<button class="btn icon wide-only" title="Во весь экран">' + I.full + '</button>' : '') +
        '<button class="btn wide-only">' + I.report + 'Быстрый отчёт</button>' + (c.extra || '') +
        '<button class="btn primary">' + I.plus + '<span class="lbl">' + c.newLabel + '</span></button></div></div>' +
      '<div class="period-row">' + period() + '</div>' +
      '<div class="summary">' + c.summary + '</div>' +
      '<div class="filters"><label class="search">' + I.search + '<input placeholder="' + (phone ? c.search.split(', ').slice(0, 2).join(', ') : c.search) + '" value="' + state.q + '"></label>' +
        whoBtn + what + select(c.status, 'status') +
        '<button class="btn" data-pop="filters">' + I.filter + 'Фильтры' + (active && phone ? ' <span class="count">' + active + '</span>' : '') + '</button>' +
        '<div class="views">' + c.views.map((v, i) => '<button data-view="' + i + '" aria-pressed="' + (state.view === i) + '">' + v + '</button>').join('') + '</div>' +
        filterPop + '</div>' +
      '<div class="chips' + (active ? ' show' : '') + '">Показано по отбору:' + chips + '<button class="reset" data-reset>Сбросить всё</button></div>' +
    '</section>' +
    '<div class="board"><table><tr>' + c.board.head.slice(0, phone ? 3 : 99).map((h) => '<th>' + h + '</th>').join('') + '</tr>' +
      c.board.rows.map((r) => '<tr>' + r.slice(0, phone ? 3 : 99).map((x) => '<td>' + x + '</td>').join('') + '</tr>').join('') + '</table></div>' +
    '<p class="note">Тело журнала здесь условное: эскиз про шапку. Сетка каждого направления остаётся своей.</p>' +
    '</main></div>';
  document.getElementById('root').innerHTML = html;
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('button, li');
  if (!t) { if (!e.target.closest('.pop')) { state.pop = ''; render(); } return; }
  if (t.dataset.v) { state = { ...state, v: t.dataset.v, who: '', what: '', status: '', view: 0, pop: '' }; }
  else if (t.dataset.h) { state.h = t.dataset.h; }
  else if (t.dataset.d) { state.d = t.dataset.d; state.pop = ''; }
  else if (t.dataset.pop) { state.pop = state.pop === t.dataset.pop ? '' : t.dataset.pop; }
  else if (t.dataset.view) { state.view = +t.dataset.view; }
  else if (t.dataset.shift !== undefined) { state.what = state.what === t.dataset.shift ? '' : t.dataset.shift; }
  else if (t.dataset.who !== undefined) { state.who = t.dataset.who; state.pop = ''; }
  else if (t.dataset.clear) { state[t.dataset.clear] = ''; }
  else if (t.hasAttribute('data-reset')) { state.who = state.what = state.status = ''; }
  else if (t.hasAttribute('data-close')) { state.pop = ''; }
  else if (t.closest('.pop')) return;
  document.querySelectorAll('.switcher button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.v === state.v || b.dataset.d === state.d || b.dataset.h === state.h));
  render();
});
document.addEventListener('change', (e) => { const k = e.target.dataset.k; if (k) { state[k] = e.target.value; render(); } });
// для снимков: ?v=salon&d=phone&pop=date&who=...&status=...
const p = new URLSearchParams(location.search);
for (const k of ['h', 'v', 'd', 'pop', 'who', 'what', 'status']) if (p.get(k)) state[k] = p.get(k);
document.querySelectorAll('.switcher button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.v === state.v || b.dataset.d === state.d || b.dataset.h === state.h));
render();
// часы идут по-настоящему (в WETOP: по поясу филиала)
setInterval(() => { const el = document.getElementById('clk'); if (el && !p.get('frozen')) el.textContent = new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }); }, 1000);
</script>
</body>
</html>
